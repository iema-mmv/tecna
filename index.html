    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;color:var(--slate-950);background:var(--page);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.68}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(168,215,25,.55);outline-offset:3px}.app-shell{min-height:100vh}.login-screen{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(420px,.92fr);background:#fff}.login-visual{position:relative;min-height:100vh;overflow:hidden;color:#fff;background:radial-gradient(circle at 14% 18%,rgba(209,106,166,.33),transparent 26%),radial-gradient(circle at 83% 76%,rgba(162,117,174,.48),transparent 30%),linear-gradient(145deg,#321047,#5B176F 54%,#85428F)}#network-canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.72}.visual-content{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:space-between;min-height:100vh;padding:clamp(28px,6vw,86px)}.brand-logo{display:block;width:170px;height:auto;object-fit:contain}.visual-logo{width:min(290px,66vw);padding:12px;border-radius:18px;background:rgba(255,255,255,.94);box-shadow:0 14px 30px rgba(25,6,35,.16)}.hero-copy{max-width:620px;margin:auto 0;padding:48px 0}.eyebrow{margin:0;color:var(--purple-700);font-size:.77rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.hero-copy .eyebrow{color:#F4E8F5}.hero-copy h1{max-width:610px;margin:16px 0;font-size:clamp(2.5rem,5vw,5.3rem);line-height:.98;letter-spacing:-.065em}.hero-copy p{max-width:520px;margin:0;color:#F1E8F3;font-size:clamp(1rem,1.6vw,1.22rem);line-height:1.7}.hero-keywords{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}.hero-keywords span{padding:9px 13px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(255,255,255,.1)}.login-panel{display:grid;place-items:center;padding:4 lign-items:center;gap:14px;margin:24px 0;color:var(--slate-500);font-size:.82rem}.auth-divider:before,.auth-divider:after{content:"";height:1px;flex:1;background:var(--slate-200)}.auth-footer{margin-top:26px;color:var(--slate-500);font-size:.9rem;text-align:center}.auth-message{min-height:22px;margin:12px 0;color:var(--danger);font-size:.88rem}.app-layout{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:26px 16px;background:linear-gradient(180deg,var(--purple-950),var(--purple-900));color:#fff}.sidebar-logo{width:150px;margin:0 auto 30px;border-radius:12px}.sidebar-nav{display:grid;gap:5px}.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;color:#E5D5E9;border:0;border-radius:12px;background:transparent;text-align:left}.nav-item:hover,.nav-item.active{color:#fff;background:rgba(162,117,174,.32)}.nav-icon{width:22px;text-align:center}.sidebar-bottom{margin-top:auto;padding:16px 12px 0;border-top:1px solid rgba(255,255,255,.1)}.profile-mini{display:flex;align-items:center;gap:10px;margin-bottom:16px}.avatar{display:grid;flex:0 0 auto;width:40px;height:40px;place-items:center;color:var(--purple-900);font-weight:900;border-radius:50%;background:linear-gradient(135deg,#F5D4E7,#DECBE2)}.profile-mini strong{display:block;font-size:.9rem}.profile-mini small{color:#DECBE2}.logout-button{width:100%;padding:10px 0;color:#F5D4E7;border:0;background:transparent;text-align:left}.main-content{min-width:0;padding:28px clamp(18px,4vw,54px) 54px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:34px}.topbar h1{margin:0;color:var(--purple-950);font-size:clamp(1.7rem,3vw,2.6rem)}.topbar p{margin:7px 0 0;color:var(--slate-500)}.top-actions{display:flex;align-items:center;gap:12px}.icon-button{display:grid;width:42px;height:42px;place-items:center;color:var(--purple-800);border:1px solid var(--slate-200);bord {display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;color:var(--slate-500);font-size:.76rem;font-weight:700}.progress-track{height:8px;overflow:hidden;border-radius:99px;background:var(--slate-100)}.progress-bar{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--purple-700),var(--green-500))}.project-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:13px;color:var(--slate-500);font-size:.76rem}.status-pill{padding:4px 8px;color:#587900;border-radius:999px;background:var(--green-100);font-weight:800}.status-pill.purple{color:var(--purple-800);background:var(--purple-100)}.poll-box{padding:18px;border-radius:14px;background:linear-gradient(135deg,var(--purple-100),#FCF0F7)}.poll-box h3{margin:0 0 8px;color:var(--purple-950);font-size:1rem}.poll-box p{margin:0 0 15px;color:var(--slate-500);font-size:.84rem;line-height:1.5}.poll-option{display:flex;align-items:center;gap:9px;width:100%;margin-top:8px;padding:10px;color:var(--slate-700);border:1px solid var(--purple-200);border-radius:10px;background:#fff;text-align:left}.poll-option:hover{border-color:var(--purple-600);color:var(--purple-800);background:#FAF4FB}.news-list{display:grid;gap:14px}.news-item{display:flex;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--slate-100)}.news-item:last-child{padding-bottom:0;border-bottom:0}.news-thumb{display:grid;flex:0 0 auto;width:52px;height:52px;place-items:center;color:#fff;border-radius:12px;background:linear-gradient(135deg,var(--purple-700),var(--pink-500))}.news-item h3{margin:0 0 5px;color:var(--purple-950);font-size:.88rem}.news-item p{margin:0;color:var(--slate-500);font-size:.77rem;line-height:1.4}.news-item time{display:block;margin-top:5px;color:var(--slate-500);font-size:.7rem}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.gallery-item{display:grid;aspect-ratio:1;place-items:center;border-radius:10px;color:#fff;background:linear-gradient(135deg,#C8 n:fixed;z-index:30;right:22px;bottom:22px;max-width:360px;padding:14px 17px;color:#fff;border-radius:12px;background:var(--purple-950);box-shadow:var(--shadow);opacity:0;transform:translateY(15px);pointer-events:none;transition:opacity .25s,transform .25s}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:1120px){.login-screen{grid-template-columns:minmax(0,.85fr) minmax(400px,1fr)}.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-grid{grid-template-columns:1fr}}@media(max-width:820px){.login-screen{display:block}.login-visual{min-height:380px}.visual-content{min-height:380px;padding:28px}.visual-logo{width:190px}.hero-copy{margin:25px 0 0;padding:0}.hero-copy h1{font-size:clamp(2.3rem,10vw,4rem)}.login-panel{min-height:620px;padding:46px 24px}.mobile-brand{display:block}.app-layout{display:block}.sidebar{position:fixed;z-index:12;left:0;top:0;width:270px;transform:translateX(-105%);transition:transform .25s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.menu-button{display:grid}.main-content{padding-top:20px}}@media(max-width:560px){.topbar{align-items:flex-start}.top-actions .secondary-button{display:none}.stats-grid,.project-grid,.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.content-card{padding:17px}.modal{padding:20px}}

<body>
  <main id="app" class="app-shell"></main>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    "use strict";
    const LOGO_PATH="logo-tecna.jpg";
    const SUPABASE_URL="https://jcifrmieaoqfnytdfnoz.supabase.co";
    const SUPABASE_KEY="sb_publishable_o-vRHdS3VC-40bEGIDIBUw_OtcMy5z-";
    const SITE_URL="https://iema-mmv.github.io/tecna/";
    const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const state={loggedIn:false,currentPage:"dashboard",currentUser:null,projects:[],news:[],poll:{selected:"",voted:false}};
    const app=document.getElementById("app"),modalRoot=document.getElementById("modal-root"),toast=document.getElementById("toast");
    function escapeHtml(value){return String(value??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;",'"':"&quot;"}[c]))}
    function showToast(message){toast.textContent=message;toast.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove("show"),4500)}
    function brandMarkup(classes="brand-logo"){return`<img class="${classes}" src="${LOGO_PATH}" alt="Tecna — projetos que conectam" onerror="this.style.display='none'">`}
    function authError(error){const code=error?.code||"",message=error?.message||"Erro desconhecido.";if(code==="email_not_confirmed"||message.includes("Email not confirmed"))return"O e-mail ainda não foi confirmado. Verifique sua caixa de entrada.";if(code==="invalid_credentials"||message.includes("Invalid login credentials"))return"Usuário ou senha incorretos.";if(code==="signup_disabled")return"O cadastro de novos usuários está desativado no Supabase.";if(code==="email_provider_disabled")return"O provedor de e-mail está desativado no Supabase.";if(code==="user_already_exists"||message.includes("already registered"))return"Este e-mail já possui cadastro.";return`${code?`${code}: `:""}${message}`}
    function renderLogin(){app.innerHTML=`<section class="login-screen" aria-label="Acesso ao Tecna"><section class="login-visual" aria-hidden="true"><canvas id="network-canvas"></canvas><div class="visual-content">${brandMarkup("brand-logo visual-logo")}<div class="hero-copy"><p class="eyebrow">Comunidade estudantil</p><h1>Ideias que se conectam.</h1><p>Crie, acompanhe e compartilhe projetos que transformam o futuro da tecnologia.</p><div class="hero-keywords"><span>✦ Criar</span><span>↗ Colaborar</span><span>♡ Aprender</span></div></div><small>Um espaço para dar visibilidade ao talento e à criatividade.</small></div></section><section class="login-panel"><div class="auth-card"><div class="mobile-brand">${brandMarkup("brand-logo mobile-logo")}</div><p class="eyebrow">Acesso à plataforma</p><h2>Bem-vinda ao Tecna</h2><p class="auth-intro">Entre para acompanhar e compartilhar projetos.</p><form id="login-form" novalidate><div class="form-group"><label for="login-identifier">E-mail ou nome de usuário</label><input class="input" id="login-identifier" name="identifier" autocomplete="username" placeholder="voce@exemplo.com ou seu_usuario" required></div><div class="form-group"><label for="login-password">Senha</label><div class="input-wrap"><input class="input password-input" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required minlength="6"><button class="toggle-password" type="button" data-toggle-password="login-password" aria-label="Mostrar senha">◉</button></div></div><div class="password-row"><label class="checkbox-label"><input type="checkbox" name="remember"> Lembrar de mim</label><button class="text-button" type="button" data-action="forgot-password">Esqueci minha senha</button></div><p id="login-message" class="auth-message" role="alert"></p><button class="primary-button" type="submit">Entrar</button></form><div class="auth-divider">ou</div><button class="secondary-button" type="button" data-action="create-account" style="width:100%">Criar uma conta</button><p class="auth-footer">Plataforma educacional Tecna.</p></div></section></section>`;initCanvas()}
    function pageTitle(){return({dashboard:`Olá, ${(state.currentUser?.nome||"estudante").split(" ")[0]}!`,projects:"Projetos",news:"Notícias do Tecna",voting:"Votações",profile:"Meu perfil"})[state.currentPage]||"Olá!"}function pageSubtitle(){return({dashboard:"Acompanhe suas ideias e descubra novos projetos.",projects:"Explore projetos, equipes e ideias da comunidade.",news:"Acompanhe as novidades e conquistas da comunidade.",voting:"Participe das decisões e valorize projetos inspiradores.",profile:"Apresente sua trajetória e seus interesses."})[state.currentPage]||""}
    function renderApp(){app.innerHTML=`<div class="app-layout"><aside id="sidebar" class="sidebar">${brandMarkup("brand-logo sidebar-logo")}<nav class="sidebar-nav" aria-label="Navegação principal"><button class="nav-item ${state.currentPage==="dashboard"?"active":""}" data-page="dashboard"><span class="nav-icon">⌂</span>Visão geral</button><button class="nav-item ${state.currentPage==="projects"?"active":""}" data-page="projects"><span class="nav-icon">▣</span>Projetos</button><button class="nav-item ${state.currentPage==="news"?"active":""}" data-page="news"><span class="nav-icon">✦</span>Notícias</button><button class="nav-item ${state.currentPage==="voting"?"active":""}" data-page="voting"><span class="nav-icon">◉</span>Destaque do mês</button><button class="nav-item ${state.currentPage==="profile"?"active":""}" data-page="profile"><span class="nav-icon">♙</span>Meu perfil</button></nav><div class="sidebar-bottom"><div class="profile-mini"><span class="avatar">${escapeHtml((state.currentUser?.nome||"NS").slice(0,2).toUpperCase())}</span><div><strong>${escapeHtml(state.currentUser?.nome||"Nova estudante")}</strong><small>${escapeHtml(state.currentUser?.curso||"Estudante")}</small></div></div><button class="logout-button" data-action="logout">↪ Sair da conta</button></div></aside><section class="main-content"><header class="topbar"><div><button class="icon-button menu-button" data-action="toggle-menu" aria-label="Abrir menu">☰</button><h1>${pageTitle()}</h1><p>${pageSubtitle()}</p></div><div class="top-actions"><button class="secondary-button" data-action="create-project">+ Novo projeto</button><button class="icon-button" data-action="notifications" aria-label="Notificações">♧</button></div></header>${renderCurrentPage()}</section></div>`}
    function renderCurrentPage(){if(state.currentPage==="projects")return renderProjectsPage();if(state.currentPage==="news")return renderNewsPage();if(state.currentPage==="voting")return renderVotingPage();if(state.currentPage==="profile")return renderProfilePage();return renderDashboard()}
    function projectCard(project){const cover=project.imagem_capa_url?`style="background-image:linear-gradient(135deg,rgba(50,16,71,.45),rgba(209,106,166,.35)),url('${escapeHtml(project.imagem_capa_url)}')"`:"";return`<article class="project-card"><div class="project-cover" ${cover}><h3>${escapeHtml(project.titulo)}</h3></div><div class="project-body"><p>${escapeHtml(project.descricao)}</p><div class="progress-row"><span>Progresso</span><span>${project.progresso||0}%</span></div><div class="progress-track"><div class="progress-bar" style="width:${project.progresso||0}%"></div></div><div class="project-meta"><span>${escapeHtml(project.area)}</span><span class="status-pill ${project.progresso<60?"purple":""}">${escapeHtml(project.status||"Planejamento")}</span></div><button class="ghost-button button-small" data-project-id="${project.id}" style="width:100%;margin-top:14px">Ver detalhes</button></div></article>`}
    function newsItem(news){return`<article class="news-item"><div class="news-thumb">✦</div><div><h3>${escapeHtml(news.titulo)}</h3><p>${escapeHtml(news.resumo||"")}</p><time>${news.publicado_em?new Date(news.publicado_em).toLocaleDateString("pt-BR"):"Recentemente"}</time><button class="link-button" data-news-id="${news.id}" style="margin-top:7px">Ler notícia</button></div></article>`}
    function featuredProjects(){return state.projects.length?`<h2 class="section-label">Descubra projetos</h2><div class="horizontal-scroll">${state.projects.map(projectCard).join("")}</div>`:`<h2 class="section-label">Descubra projetos</h2><div class="content-card empty-state">Os projetos da comunidade aparecerão aqui assim que forem publicados.</div>`}
    function renderDashboard(){const average=state.projects.length?Math.round(state.projects.reduce((sum,project)=>sum+(project.progresso||0),0)/state.projects.length):0;const latest=state.projects.slice(0,3);return`<section class="page-section active"><div class="stats-grid"><article class="stat-card"><span class="stat-label">Meus projetos</span><div class="stat-value">${state.projects.length}</div><div class="stat-trend">Projetos cadastrados</div></article><article class="stat-card"><span class="stat-label">Projetos acompanhados</span><div class="stat-value">0</div><div class="stat-trend">Em breve</div></article><article class="stat-card"><span class="stat-label">Sugestões recebidas</span><div class="stat-value">0</div><div class="stat-trend">Nenhuma pendência</div></article><article class="stat-card"><span class="stat-label">Progresso médio</span><div class="stat-value">${average}%</div><div class="stat-trend">Baseado nos seus projetos</div></article></div><div class="dashboard-grid"><article class="content-card"><div class="card-heading"><div><h2>Continue sua jornada</h2><p>Retome um projeto ou descubra uma nova ideia.</p></div><button class="link-button" data-page="projects">Ver todos</button></div><div class="project-grid">${latest.length?latest.map(projectCard).join(""):`<div class="empty-state" style="grid-column:1/-1">Você ainda não cadastrou nenhum projeto.<br><button class="primary-button button-small" data-action="create-project" style="margin-top:16px;width:auto">Criar meu primeiro projeto</button></div>`}</div></article><div style="display:grid;gap:22px;align-content:start"><article class="content-card"><div class="card-heading"><div><h2>Destaque do mês</h2><p>Valorize projetos e estudantes da comunidade.</p></div><span class="status-pill purple">Ativo</span></div><div class="poll-box"><h3>Projeto e aluna destaque</h3><p>Participe da escolha dos trabalhos que mais inspiraram a comunidade.</p><button class="primary-button button-small" data-page="voting">Conhecer destaques</button></div></article><article class="content-card"><div class="card-heading"><div><h2>Notícias recentes</h2><p>O que está acontecendo no Tecna.</p></div><button class="link-button" data-page="news">Ver todas</button></div><div class="news-list">${state.news.length?state.news.slice(0,3).map(newsItem).join(""):`<div class="empty-state">As notícias aparecerão aqui.</div>`}</div></article></div></div>${featuredProjects()}<article class="content-card" style="margin-top:28px"><div class="card-heading"><div><h2>Galeria de projetos</h2><p>Registros recentes das equipes em ação.</p></div><button class="link-button" data-page="projects">Explorar</button></div><div class="gallery"><div class="gallery-item">✦</div><div class="gallery-item">⌁</div><div class="gallery-item">◈</div><div class="gallery-item">♡</div></div></article></section>`}
    function renderProjectsPage(){return`<section class="page-section active"><div class="toolbar"><input class="input" id="project-search" type="search" placeholder="Buscar projeto..."><select class="select" id="project-filter"><option value="all">Todas as áreas</option><option>Sustentabilidade</option><option>Robótica</option><option>Aplicativos</option><option>Cultura</option><option>Inteligência artificial</option></select><button class="primary-button button-small" data-action="create-project">+ Cadastrar projeto</button></div><div id="projects-list" class="project-grid">${state.projects.length?state.projects.map(projectCard).join(""):`<div class="empty-state" style="grid-column:1/-1">Nenhum projeto cadastrado ainda.</div>`}</div></section>`}
    function renderNewsPage(){return`<section class="page-section active"><article class="content-card"><div class="card-heading"><div><h2>Atualizações da comunidade</h2><p>Notícias de projetos, eventos e oportunidades.</p></div><button class="secondary-button button-small" data-action="coming-soon">Publicar notícia</button></div><div class="news-list">${state.news.length?state.news.map(newsItem).join(""):`<div class="empty-state">Nenhuma notícia publicada.</div>`}</div></article></section>`}
    function renderVotingPage(){return`<section class="page-section active"><article class="content-card"><div class="card-heading"><div><h2>Destaque do mês</h2><p>Reconheça o projeto e a aluna que mais inspiraram a comunidade.</p></div><span class="status-pill purple">Em preparação</span></div><div class="poll-box"><h3>Projeto destaque do mês</h3><p>O painel poderá reunir os projetos com maior participação, impacto e evolução.</p><button class="poll-option" data-action="coming-soon">◉ Escolher projeto destaque</button><button class="poll-option" data-action="coming-soon">♙ Escolher aluna destaque</button></div></article></section>`}
    function renderProfilePage(){const user=state.currentUser||{};return`<section class="page-section active"><article class="content-card"><div style="display:flex;align-items:center;gap:18px;margin-bottom:25px"><span class="avatar" style="width:76px;height:76px;font-size:1.4rem">${escapeHtml((user.nome||"NS").slice(0,2).toUpperCase())}</span><div><h2 style="margin:0;color:var(--purple-950)">${escapeHtml(user.nome||"Nova estudante")}</h2><p style="margin:6px 0;color:var(--slate-500)">${escapeHtml(user.curso||"Curso não informado")} · ${escapeHtml(user.turma||"Turma não informada")}</p></div></div><div class="form-grid"><div class="form-group"><label>Nome completo</label><input class="input" id="profile-name" value="${escapeHtml(user.nome||"")}"></div><div class="form-group"><label>Nome de usuário</label><input class="input" id="profile-username" value="${escapeHtml(user.username||"")}" placeholder="seu_usuario"></div><div class="form-group"><label>Curso</label><input class="input" id="profile-course" value="${escapeHtml(user.curso||"")}"></div><div class="form-group"><label>Turma</label><input class="input" id="profile-class" value="${escapeHtml(user.turma||"")}"></div><div class="form-group full"><label>Sobre você</label><textarea class="textarea" id="profile-bio">${escapeHtml(user.biografia||"")}</textarea></div></div><button class="primary-button button-small" data-action="save-profile" style="margin-top:8px">Salvar alterações</button></article></section>`}
    function openModal(type){if(type==="forgot")modalRoot.innerHTML=`<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true"><div class="modal-header"><div><p class="eyebrow">Recuperação de acesso</p><h2>Esqueci minha senha</h2></div><button class="close-button" data-close-modal>×</button></div><p style="color:var(--slate-500);line-height:1.6">A recuperação é enviada para o e-mail da conta.</p><form id="forgot-form"><div class="form-group"><label for="forgot-email">E-mail</label><input class="input" id="forgot-email" type="email" required></div><button class="primary-button" type="submit">Enviar instruções</button></form></section></div>`;if(type==="account")modalRoot.innerHTML=`<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true"><div class="modal-header"><div><p class="eyebrow">Faça parte da comunidade</p><h2>Criar uma conta</h2></div><button class="close-button" data-close-modal>×</button></div><form id="account-form"><div class="form-grid"><div class="form-group full"><label for="account-name">Nome completo</label><input class="input" id="account-name" required></div><div class="form-group"><label for="account-username">Nome de usuário</label><input class="input" id="account-username" pattern="[a-z0-9_]{3,20}" placeholder="ex: maria_silva" required></div><div class="form-group"><label for="account-email">E-mail</label><input class="input" id="account-email" type="email" required></div><div class="form-group"><label for="account-course">Curso</label><input class="input" id="account-course" required></div><div class="form-group"><label for="account-class">Turma</label><input class="input" id="account-class" required></div><div class="form-group"><label for="account-password">Senha</label><input class="input" id="account-password" type="password" minlength="6" required></div><div class="form-group full"><label for="account-about">Breve apresentação</label><textarea class="textarea" id="account-about"></textarea></div></div><p id="account-message" class="auth-message"></p><button class="primary-button" type="submit">Criar conta</button></form></section></div>`;if(type==="project")modalRoot.innerHTML=`<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true"><div class="modal-header"><div><p class="eyebrow">Nova iniciativa</p><h2>Cadastrar projeto</h2></div><button class="close-button" data-close-modal>×</button></div><form id="project-form"><div class="form-grid"><div class="form-group full"><label for="project-title">Nome do projeto</label><input class="input" id="project-title" required></div><div class="form-group"><label for="project-area">Área</label><select class="select" id="project-area"><option>Sustentabilidade</option><option>Robótica</option><option>Aplicativos</option><option>Cultura</option><option>Inteligência artificial</option></select></div><div class="form-group"><label for="project-progress">Progresso inicial</label><input class="input" id="project-progress" type="number" min="0" max="100" value="0" required></div><div class="form-group"><label for="project-visibility">Participação</label><select class="select" id="project-visibility"><option value="aberto">Projeto aberto — qualquer pessoa pode solicitar participação</option><option value="fechado">Projeto fechado — autora define as participantes</option></select></div><div class="form-group full"><label for="project-description">Objetivo e descrição</label><textarea class="textarea" id="project-description" required></textarea></div><div class="form-group full"><label for="project-image">URL da imagem de capa (opcional)</label><input class="input" id="project-image" type="url" placeholder="https://..."></div></div><p id="project-message" class="auth-message"></p><button class="primary-button" type="submit">Salvar projeto</button></form></section></div>`}
    function openProjectDetails(id){const project=state.projects.find(item=>item.id===id);if(!project)return;modalRoot.innerHTML=`<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true"><div class="modal-header"><div><p class="eyebrow">Detalhes do projeto</p><h2>${escapeHtml(project.titulo)}</h2></div><button class="close-button" data-close-modal>×</button></div><div class="detail-cover" ${project.imagem_capa_url?`style="background-image:linear-gradient(135deg,rgba(50,16,71,.45),rgba(209,106,166,.35)),url('${escapeHtml(project.imagem_capa_url)}')"`:""}><h2>${escapeHtml(project.titulo)}</h2></div><div class="detail-block"><h3>Sobre o projeto</h3><p>${escapeHtml(project.descricao)}</p></div><div class="detail-block"><h3>Participação</h3><p>${project.tipo_participacao==="aberto"?"Projeto aberto para solicitações de participação.":"Projeto fechado, com participantes definidos pela responsável."}</p><button class="primary-button button-small" data-action="request-participation" data-project-id="${project.id}">${project.tipo_participacao==="aberto"?"Pedir para participar":"Projeto fechado"}</button></div><div class="detail-block"><h3>Progresso</h3><div class="progress-row"><span>${escapeHtml(project.status||"Em andamento")}</span><strong>${project.progresso||0}%</strong></div><div class="progress-track"><div class="progress-bar" style="width:${project.progresso||0}%"></div></div></div></section></div>`}
    function openNewsDetails(id){const item=state.news.find(news=>news.id===id);if(!item)return;modalRoot.innerHTML=`<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true"><div class="modal-header"><div><p class="eyebrow">Notícia Tecna</p><h2>${escapeHtml(item.titulo)}</h2></div><button class="close-button" data-close-modal>×</button></div><div class="detail-block"><p>${escapeHtml(item.conteudo||item.resumo||"")}</p></div></section></div>`}
    function closeModal(){modalRoot.innerHTML=""}
    async function loadUser(){const{data:{session}}=await supabaseClient.auth.getSession();if(session){state.loggedIn=true;await loadProfile(session.user);await loadData();renderApp()}else{state.loggedIn=false;renderLogin()}supabaseClient.auth.onAuthStateChange(async(event,currentSession)=>{if(event==="SIGNED_OUT"){state.loggedIn=false;state.currentUser=null;state.projects=[];state.news=[];renderLogin()}if(event==="SIGNED_IN"&&currentSession){state.loggedIn=true;await loadProfile(currentSession.user);await loadData();renderApp()}})}
    async function loadProfile(user){const{data,error}=await supabaseClient.from("profiles").select("*").eq("id",user.id).maybeSingle();state.currentUser=error||!data?{id:user.id,nome:user.user_metadata?.nome||"Nova estudante",username:user.user_metadata?.username||"",email:user.email,curso:user.user_metadata?.curso||"",turma:user.user_metadata?.turma||"",biografia:user.user_metadata?.biografia||""}:data}
    async function loadData(){const{data:projects}=await supabaseClient.from("projects").select("*").or(`status_publicacao.eq.publicado,autora_id.eq.${state.currentUser.id}`).order("created_at",{ascending:false});const{data:news}=await supabaseClient.from("news").select("*").eq("status","publicado").order("publicado_em",{ascending:false});state.projects=projects||[];state.news=news||[]}
    async function findEmailByUsername(username){const{data,error}=await supabaseClient.from("profiles").select("email").eq("username",username).maybeSingle();if(error||!data)return null;return data.email}
    async function login(event){event.preventDefault();const form=event.currentTarget,message=document.getElementById("login-message"),identifier=form.identifier.value.trim(),password=form.password.value;message.textContent="";if(!identifier){message.textContent="Digite seu e-mail ou nome de usuário.";return}if(password.length<6){message.textContent="A senha deve ter pelo menos 6 caracteres.";return}const email=identifier.includes("@")?identifier:await findEmailByUsername(identifier);if(!email){message.textContent="Usuário ou e-mail não encontrado.";return}const button=form.querySelector("button[type='submit']");button.disabled=true;button.textContent="Entrando...";const{error}=await supabaseClient.auth.signInWithPassword({email,password});button.disabled=false;button.textContent="Entrar";if(error)message.textContent=authError(error)}
    async function submitAccount(event){event.preventDefault();const message=document.getElementById("account-message"),name=document.getElementById("account-name").value.trim(),username=document.getElementById("account-username").value.trim().toLowerCase(),email=document.getElementById("account-email").value.trim(),course=document.getElementById("account-course").value.trim(),className=document.getElementById("account-class").value.trim(),password=document.getElementById("account-password").value,about=document.getElementById("account-about").value.trim(),button=event.currentTarget.querySelector("button[type='submit']");if(!/^[a-z0-9_]{3,20}$/.test(username)){message.textContent="O usuário deve ter de 3 a 20 caracteres: letras minúsculas, números ou _.";return}const{data:existing,error:existingError}=await supabaseClient.from("profiles").select("id").eq("username",username).maybeSingle();if(existingError){message.textContent=`Não foi possível verificar o usuário: ${existingError.message}`;return}if(existing){message.textContent="Esse nome de usuário já está em uso.";return}button.disabled=true;button.textContent="Criando...";const{data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{nome:name,username,curso:course,turma:className,biografia:about},emailRedirectTo:SITE_URL}});button.disabled=false;button.textContent="Criar conta";if(error){console.error("Erro completo do cadastro:",error);message.textContent=authError(error);return}closeModal();showToast(data.session?"Conta criada e login realizado.":"Conta criada. Verifique seu e-mail para confirmar o cadastro.")}
    async function submitProject(event){event.preventDefault();const message=document.getElementById("project-message");if(!state.currentUser?.id){message.textContent="Faça login para cadastrar um projeto.";return}const titulo=document.getElementById("project-title").value.trim(),descricao=document.getElementById("project-description").value.trim(),area=document.getElementById("project-area").value,progresso=Math.max(0,Math.min(100,Number(document.getElementById("project-progress").value))),imagem=document.getElementById("project-image").value.trim(),tipo=document.getElementById("project-visibility").value;const payload={titulo,descricao,area,progresso,autora_id:state.currentUser.id,imagem_capa_url:imagem||null,status:progresso>=100?"concluido":progresso>0?"em_andamento":"planejamento",status_publicacao:"pendente"};const{error}=await supabaseClient.from("projects").insert({...payload,tipo_participacao:tipo});if(error){message.textContent=`Erro ao salvar projeto: ${error.message}`;return}closeModal();await loadData();renderApp();showToast("Projeto enviado para análise.")}
    async function saveProfile(){const payload={nome:document.getElementById("profile-name").value.trim(),username:document.getElementById("profile-username").value.trim().toLowerCase(),curso:document.getElementById("profile-course").value.trim(),turma:document.getElementById("profile-class").value.trim(),biografia:document.getElementById("profile-bio").value.trim(),updated_at:new Date().toISOString()};if(!/^[a-z0-9_]{3,20}$/.test(payload.username)){showToast("O nome de usuário deve ter entre 3 e 20 caracteres válidos.");return}const{data,error}=await supabaseClient.from("profiles").update(payload).eq("id",state.currentUser.id).select().single();if(error){showToast(`Erro ao salvar perfil: ${error.message}`);return}state.currentUser=data;renderApp();showToast("Perfil atualizado com sucesso.")}
    async function requestParticipation(projectId){showToast("A solicitação de participação será ativada na próxima etapa.");closeModal()}
    async function sendPasswordReset(event){event.preventDefault();const email=document.getElementById("forgot-email").value.trim(),{error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:SITE_URL});closeModal();showToast(error?authError(error):"Confira seu e-mail para redefinir a senha.")}
    function initCanvas(){const canvas=document.getElementById("network-canvas");if(!canvas)return;const ctx=canvas.getContext("2d"),reduced=matchMedia("(prefers-reduced-motion: reduce)").matches,points=[],pointer={x:null,y:null},colors=["#FFF","#DECBE2","#F5D4E7","#A8D719"];let width=0,height=0;function resize(){const ratio=Math.min(devicePixelRatio||1,2);width=canvas.clientWidth;height=canvas.clientHeight;canvas.width=width*ratio;canvas.height=height*ratio;ctx.setTransform(ratio,0,0,ratio,0,0)}function create(){points.length=0;const amount=Math.min(74,Math.max(28,Math.floor(width*height/17000)));for(let i=0;i<amount;i++)points.push({x:Math.random()*width,y:Math.random()*height,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,radius:Math.random()*2.2+1,color:colors[i%colors.length]})}function draw(){ctx.clearRect(0,0,width,height);for(const p of points){if(!reduced){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>width)p.vx*=-1;if(p.y<0||p.y>height)p.vy*=-1}if(pointer.x!==null){const dx=pointer.x-p.x,dy=pointer.y-p.y,d=Math.hypot(dx,dy);if(d<130&&d>0){p.x-=dx/d*.12;p.y-=dy/d*.12}}}for(let i=0;i<points.length;i++)for(let j=i+1;j<points.length;j++){const d=Math.hypot(points[i].x-points[j].x,points[i].y-points[j].y);if(d<150){ctx.strokeStyle=`rgba(255,255,255,${Math.max(0,.22-d/900)})`;ctx.beginPath();ctx.moveTo(points[i].x,points[i].y);ctx.lineTo(points[j].x,points[j].y);ctx.stroke()}}for(const p of points){ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);ctx.fill()}if(!reduced)requestAnimationFrame(draw)}resize();create();draw();addEventListener("resize",()=>{resize();create();if(reduced)draw()});canvas.addEventListener("pointermove",e=>{const b=canvas.getBoundingClientRect();pointer.x=e.clientX-b.left;pointer.y=e.clientY-b.top});canvas.addEventListener("pointerleave",()=>{pointer.x=null;pointer.y=null})}
    function handleAction(action){if(action==="forgot-password")openModal("forgot");if(action==="create-account")openModal("account");if(action==="create-project")openModal("project");if(action==="logout")supabaseClient.auth.signOut();if(action==="notifications")showToast("Você não tem novas notificações.");if(action==="toggle-menu")document.getElementById("sidebar")?.classList.toggle("open");if(action==="save-profile")saveProfile();if(action==="coming-soon")showToast("Esta função será liberada no próximo módulo.")}
    function setPage(page){state.currentPage=page;renderApp();scrollTo({top:0,behavior:"smooth"})}
    document.addEventListener("submit",e=>{if(e.target.id==="login-form")login(e);if(e.target.id==="forgot-form")sendPasswordReset(e);if(e.target.id==="account-form")submitAccount(e);if(e.target.id==="project-form")submitProject(e)});
    document.addEventListener("click",e=>{const action=e.target.closest("[data-action]"),page=e.target.closest("[data-page]"),toggle=e.target.closest("[data-toggle-password]"),project=e.target.closest("[data-project-id]"),news=e.target.closest("[data-news-id]");if(e.target.matches("[data-close-modal]")||e.target.closest("[data-close-modal]"))if(e.target.classList.contains("modal-backdrop")||e.target.closest(".close-button"))closeModal();if(action){if(action.dataset.action==="request-participation")requestParticipation(action.dataset.projectId);else handleAction(action.dataset.action)}if(page)setPage(page.dataset.page);if(project&&!action)openProjectDetails(project.dataset.projectId);if(news)openNewsDetails(news.dataset.newsId);if(toggle){const input=document.getElementById(toggle.dataset.togglePassword);input.type=input.type==="password"?"text":"password";toggle.setAttribute("aria-label",input.type==="password"?"Mostrar senha":"Ocultar senha")}});
    document.addEventListener("input",e=>{if(e.target.id==="project-search"||e.target.id==="project-filter"){const q=document.getElementById("project-search")?.value.toLowerCase()||"",f=document.getElementById("project-filter")?.value||"all",filtered=state.projects.filter(p=>(p.titulo||"").toLowerCase().includes(q)&&(f==="all"||p.area===f)),list=document.getElementById("projects-list");if(list)list.innerHTML=filtered.length?filtered.map(projectCard).join(""):`<div class="empty-state" style="grid-column:1/-1">Nenhum projeto encontrado.</div>`}});
    loadUser();
  </script>
