<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#5B176F"><title>Tecna | Projetos que conectam</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p950:#321047;--p900:#4B1262;--p800:#5B176F;--p700:#70227F;--p200:#DECBE2;--p100:#F1E8F3;--pink:#D16AA6;--green:#A8D719;--green-dark:#8FBE0B;--s950:#241A2B;--s500:#766B7D;--s200:#E9E2EB;--page:#FCFAFD;--danger:#C62828}*{box-sizing:border-box}body{margin:0;min-width:320px;color:var(--s950);background:var(--page);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.login-screen{min-height:100vh;display:grid;grid-template-columns:1.08fr .92fr;background:#fff}.login-visual{position:relative;min-height:100vh;overflow:hidden;color:#fff;background:radial-gradient(circle at 14% 18%,rgba(209,106,166,.33),transparent 26%),radial-gradient(circle at 83% 76%,rgba(162,117,174,.48),transparent 30%),linear-gradient(145deg,#321047,#5B176F 54%,#85428F)}#network-canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.72}.visual-content{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:space-between;min-height:100vh;padding:clamp(28px,6vw,86px)}.brand-logo{display:block;width:170px;height:auto}.visual-logo{width:min(290px,66vw);padding:12px;border-radius:18px;background:#fff}.hero-copy{max-width:620px;margin:auto 0;padding:48px 0}.eyebrow{margin:0;color:var(--p700);font-size:.77rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.hero-copy .eyebrow{color:#F4E8F5}.hero-copy h1{margin:16px 0;font-size:clamp(2.5rem,5vw,5.3rem);line-height:.98}.hero-copy p{max-width:520px;color:#F1E8F3;font-size:1.15rem;line-height:1.7}.hero-keywords{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}.hero-keywords span{padding:9px 13px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(255,255,255,.1)}.login-panel{display:grid;place-items:center;padding:42px clamp(22px,6vw,86px)}.auth-card{width:min(100%,440px)}.mobile-logo{display:none}.auth-card h2{margin:12px 0 10px;color:var(--p950);font-size:clamp(2rem,4vw,3rem)}.auth-intro{margin:0 0 30px;color:var(--s500);line-height:1.6}.form-group{margin-bottom:18px}.form-group label{display:block;margin-bottom:8px;font-size:.9rem;font-weight:700}.input-wrap{position:relative}.input{width:100%;padding:14px 15px;border:1px solid var(--s200);border-radius:10px;background:#fff}.input:focus{border-color:var(--p700);box-shadow:0 0 0 4px rgba(133,66,143,.14);outline:none}.password-input{padding-right:50px}.toggle-password{position:absolute;top:50%;right:10px;transform:translateY(-50%);padding:7px;border:0;background:transparent;color:var(--s500)}.password-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.checkbox-label{display:flex;align-items:center;gap:8px;color:var(--s500);font-size:.86rem}.text-button{padding:0;border:0;background:transparent;color:var(--p700);font-weight:700}.primary-button,.secondary-button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 18px;border-radius:10px;font-weight:800}.primary-button{width:100%;border:1px solid var(--green-dark);background:linear-gradient(135deg,var(--green),#C8ED50);color:var(--p950)}.secondary-button{width:100%;border:1px solid var(--p200);background:var(--p100);color:var(--p800)}.auth-divider{display:flex;align-items:center;gap:14px;margin:24px 0;color:var(--s500);font-size:.82rem}.auth-divider:before,.auth-divider:after{content:"";height:1px;flex:1;background:var(--s200)}.auth-footer{text-align:center;color:var(--s500);font-size:.9rem}.auth-message{min-height:22px;margin:12px 0;color:var(--danger);font-size:.88rem}@media(max-width:820px){.login-screen{display:block}.login-visual{min-height:380px}.visual-content{min-height:380px;padding:28px}.visual-logo{width:190px}.hero-copy{margin:25px 0 0;padding:0}.login-panel{min-height:620px;padding:46px 24px}.mobile-logo{display:block;width:160px;margin-bottom:28px}}
</style>
</head>
<body><main id="app"></main>
<script>
"use strict";
const SUPABASE_URL="https://jcifrmieaoqfnytdfnoz.supabase.co";
const SUPABASE_KEY="sb_publishable_o-vRHdS3VC-40bEGIDIBUw_OtcMy5z-";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const SITE_URL="https://iema-mmv.github.io/tecna/";
const app=document.getElementById("app");
function renderLogin(){app.innerHTML=`<section class="login-screen"><section class="login-visual"><canvas id="network-canvas"></canvas><div class="visual-content"><img class="brand-logo visual-logo" src="logo-tecna.jpg" alt="Tecna"><div class="hero-copy"><p class="eyebrow">Comunidade estudantil</p><h1>Ideias que se conectam.</h1><p>Crie, acompanhe e compartilhe projetos que transformam o futuro da tecnologia.</p><div class="hero-keywords"><span>✦ Criar</span><span>↗ Colaborar</span><span>♡ Aprender</span></div></div><small>Um espaço para dar visibilidade ao talento e à criatividade.</small></div></section><section class="login-panel"><div class="auth-card"><img class="brand-logo mobile-logo" src="logo-tecna.jpg" alt="Tecna"><p class="eyebrow">Acesso à plataforma</p><h2>Bem-vindo ao Tecna</h2><p class="auth-intro">Entre para acompanhar e compartilhar projetos.</p><form id="login-form"><div class="form-group"><label for="login-identifier">E-mail ou nome de usuário</label><input id="login-identifier" class="input" autocomplete="username" required></div><div class="form-group"><label for="login-password">Senha</label><div class="input-wrap"><input id="login-password" class="input password-input" type="password" autocomplete="current-password" minlength="6" required><button id="toggle-password" class="toggle-password" type="button">◉</button></div></div><div class="password-row"><label class="checkbox-label"><input type="checkbox"> Lembrar de mim</label><button id="forgot-password" class="text-button" type="button">Esqueci minha senha</button></div><p id="login-message" class="auth-message"></p><button id="login-submit" class="primary-button" type="submit">Entrar</button></form><div class="auth-divider">ou</div><button id="create-account" class="secondary-button" type="button">Criar uma conta</button><p class="auth-footer">Plataforma educacional Tecna.</p></div></section></section>`;bindLogin();animateNetwork()}
function message(error){const text=String(error?.message||error||"Não foi possível entrar.");if(text.toLowerCase().includes("invalid login credentials"))return"E-mail/username ou senha incorretos.";if(text.toLowerCase().includes("email not confirmed"))return"Confirme o e-mail antes de entrar.";return text}
async function resolveEmail(value){const identifier=String(value||"").trim();if(!identifier)return null;if(identifier.includes("@"))return identifier.toLowerCase();const rpc=await supabaseClient.rpc("resolve_username",{username_input:identifier});if(!rpc.error&&rpc.data?.length)return rpc.data[0].email;const profile=await supabaseClient.from("profiles").select("email").ilike("username",identifier).maybeSingle();if(!profile.error)return profile.data?.email||null;return null}
async function handleLogin(event){event.preventDefault();const id=document.getElementById("login-identifier").value.trim(),password=document.getElementById("login-password").value,messageBox=document.getElementById("login-message"),button=document.getElementById("login-submit");messageBox.textContent="";if(!id||!password){messageBox.textContent="Informe o e-mail/username e a senha.";return}button.disabled=true;button.textContent="Entrando...";try{const email=await resolveEmail(id);if(!email){messageBox.textContent="E-mail ou username não encontrado.";return}const result=await supabaseClient.auth.signInWithPassword({email,password});if(result.error){messageBox.textContent=message(result.error);return}const session=await supabaseClient.auth.getSession();if(!session.data.session){messageBox.textContent="A sessão não foi confirmada pelo Supabase.";return}messageBox.style.color="#587900";messageBox.textContent="Login realizado.";setTimeout(()=>{window.location.href=SITE_URL},400)}catch(error){messageBox.textContent=message(error)}finally{button.disabled=false;button.textContent="Entrar"}}
function bindLogin(){document.getElementById("login-form").addEventListener("submit",handleLogin);document.getElementById("toggle-password").addEventListener("click",()=>{const input=document.getElementById("login-password");input.type=input.type==="password"?"text":"password"});document.getElementById("create-account").addEventListener("click",()=>{document.getElementById("login-message").textContent="Use o formulário de cadastro da versão completa do Tecna."});document.getElementById("forgot-password").addEventListener("click",async()=>{const email=window.prompt("Digite o e-mail usado no cadastro:");if(!email)return;const result=await supabaseClient.auth.resetPasswordForEmail(email.trim(),{redirectTo:SITE_URL});window.alert(result.error?message(result.error):"Confira seu e-mail para redefinir a senha.")})}
function animateNetwork(){const c=document.getElementById("network-canvas");if(!c)return;const x=c.getContext("2d"),points=[];let w=0,h=0;function resize(){w=c.clientWidth;h=c.clientHeight;const r=window.devicePixelRatio||1;c.width=w*r;c.height=h*r;x.setTransform(r,0,0,r,0,0)}for(let i=0;i<58;i++)points.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25});function draw(){x.clearRect(0,0,w,h);points.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;x.fillStyle="#A8D719";x.beginPath();x.arc(p.x,p.y,2,0,7);x.fill();points.slice(i+1).forEach(q=>{const d=Math.hypot(p.x-q.x,p.y-q.y);if(d<145){x.strokeStyle=`rgba(222,203,226,${(1-d/145)*.23})`;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}})}requestAnimationFrame(draw)}resize();window.addEventListener("resize",resize);draw()}
renderLogin();
</script>
</body>
</html>
