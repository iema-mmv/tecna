<body><div id="root"></div><div id="modalRoot"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* CONFIGURAÇÃO: substitua apenas os valores abaixo. */
const SUPABASE_URL="COLE_A_URL_DO_SEU_PROJETO_SUPABASE";
const SUPABASE_ANON_KEY="COLE_A_CHAVE_ANON_PUBLICA_DO_SUPABASE";
const SOCIAL_LINKS={facebook:"#",instagram:"#",youtube:"#"};
const isConfigured=SUPABASE_URL.startsWith("https://")&&!SUPABASE_URL.includes("COLE_A_")&&SUPABASE_ANON_KEY&&!SUPABASE_ANON_KEY.includes("COLE_A_");
const supabaseClient=isConfigured?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const root=document.getElementById("root"),modalRoot=document.getElementById("modalRoot"),toast=document.getElementById("toast");
const state={user:null,profile:null,page:"dashboard",projects:[],news:[],favorites:[],currentProject:null};
const defaultSteps=["Ideia definida","Pesquisa e requisitos","Planejamento","Desenvolvimento iniciado","Desenvolvimento em andamento","Protótipo desenvolvido","Testes realizados","Apresentação finalizada"];
const demoProjects=[{id:"demo-1",titulo:"Horta inteligente",descricao:"Protótipo de irrigação automatizada para o campus.",progresso:75,status:"em_andamento",area:"Informática"},{id:"demo-2",titulo:"Campanha Conecta",descricao:"Estratégia de marketing para aproximar projetos e comunidade.",progresso:50,status:"em_testes",area:"Marketing"},{id:"demo-3",titulo:"Painel de ideias",descricao:"Espaço colaborativo para organizar soluções estudantis.",progresso:30,status:"planejamento",area:"Administração"}];
const demoNews=[{id:"demo-n1",titulo:"Projeto Horta inteligente chega à fase de testes",resumo:"A equipe concluiu o protótipo e iniciou os testes de campo.",categoria:"Projeto em destaque"},{id:"demo-n2",titulo:"Tecna abre votação para o destaque do mês",resumo:"Conheça os projetos indicados pela comunidade.",categoria:"Comunidade"},{id:"demo-n3",titulo:"Novas conexões entre estudantes e professores",resumo:"Acompanhe as novidades da plataforma.",categoria:"Plataforma"}];
function esc(x){return String(x??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}function showToast(x){toast.textContent=x;toast.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove("show"),4300)}function initials(x){return(x||"U").split(" ").map(a=>a[0]).slice(0,2).join("").toUpperCase()}function avatar(p,large=false){return`<span class="avatar ${large?"avatar-xl":""}">${p?.foto_url?`<img src="${esc(p.foto_url)}" alt="Foto de perfil">`:esc(initials(p?.nome||p?.email||"Usuário"))}</span>`}function brand(){return`<a class="brand" href="#" data-page="dashboard" aria-label="Tecna"><span class="brand-mark">✦</span><span class="brand-name">Tecna</span></a>`}function apiError(e){return e?.message||"Não foi possível concluir a operação."}function roleLabel(r){return r==="professor"?"Professor":"Aluno"}function dataProjects(){return state.projects.length?state.projects:demoProjects}function dataNews(){return state.news.length?state.news:demoNews}
function renderLogin(){root.innerHTML=`<main class="login"><section class="login-art"><div class="brand">${brand()}</div><div><p class="kicker" style="color:#f5e7f7">Comunidade estudantil</p><h1>Ideias que se conectam.</h1><p>Crie, acompanhe e compartilhe projetos que transformam o futuro da tecnologia.</p><div class="chips"><span>✦ Criar</span><span>↗ Colaborar</span><span>♡ Aprender</span></div></div><small>Um espaço para dar visibilidade ao talento e à criatividade.</small></section><section class="login-panel"><div class="auth"><p class="kicker">Acesso à plataforma</p><h2>Bem-vindo ao Tecna</h2><p class="auth-intro muted">Entre para acompanhar e compartilhar projetos.</p>${!isConfigured?`<div class="notice">Cole a URL e a chave pública do Supabase no início deste arquivo para ativar os dados reais.</div>`:""}<form id="loginForm"><div class="field"><label>E-mail ou username</label><input class="input" name="identifier" autocomplete="username" required></div><div class="field"><label>Senha</label><div class="password"><input class="input" name="password" type="password" autocomplete="current-password" minlength="6" required><button type="button" data-toggle-password="password">◉</button></div></div><div class="message" id="loginMessage"></div><button class="btn btn-primary full" type="submit">Entrar</button></form><div class="divider">ou continue com</div><div class="social-login"><button type="button" data-oauth="google"><span class="google">G</span> Google</button><button type="button" data-oauth="facebook"><span class="facebook">f</span> Facebook</button></div><p class="auth-footer">Ainda não tem uma conta? <button class="btn btn-secondary" type="button" data-action="register">Criar conta</button></p></div></section></main>`}
async function resolveEmail(v){if(v.includes("@"))return v.toLowerCase();const r=await supabaseClient.rpc("resolve_username",{username_input:v});return r.data?.[0]?.email||null}async function login(e){e.preventDefault();const f=e.currentTarget,m=document.getElementById("loginMessage");if(!isConfigured){m.textContent="Configure o Supabase no início do arquivo.";return}try{const email=await resolveEmail(f.identifier.value.trim());if(!email){m.textContent="E-mail ou username não encontrado.";return}const r=await supabaseClient.auth.signInWithPassword({email,password:f.password.value});if(r.error)throw r.error;await boot()}catch(x){m.textContent=apiError(x)}}async function oauth(provider){if(!isConfigured){showToast("Configure o Supabase antes de usar OAuth.");return}const r=await supabaseClient.auth.signInWithOAuth({provider,options:{redirectTo:location.href}});if(r.error)showToast(apiError(r.error))}
function shell(){root.innerHTML=`<div class="layout"><aside class="sidebar" id="sidebar">${brand()}<nav class="nav"><button data-page="dashboard">⌂　Visão geral</button><button data-page="projects">▣　Projetos</button><button data-page="news">✦　Notícias</button><button data-page="favorites">★　Favoritos</button><button data-page="voting">◉　Destaque do mês</button><button data-page="suggestions">♡　Sugestões</button><button data-page="profile">♙　Meu perfil</button><button data-page="teacher">♧　Área do professor</button><button data-page="admin">⚙　Administração</button></nav><div class="sidebar-bottom"><div class="mini-profile">${avatar(state.profile||state.user)}<div><strong>${esc(state.profile?.nome||state.user?.email||"Usuário")}</strong><small>@${esc(state.profile?.username||"usuário")}</small></div></div><button class="logout" data-action="logout">↪ Sair da conta</button></div></aside><main class="main"><header class="topbar"><div><button class="icon-btn menu" data-action="menu">☰</button><h1 id="pageTitle"></h1><p id="pageSubtitle"></p></div><div class="top-actions"><div class="socials"><a class="fb" href="${SOCIAL_LINKS.facebook}" target="_blank" rel="noopener">f</a><a class="ig" href="${SOCIAL_LINKS.instagram}" target="_blank" rel="noopener">◎</a><a class="yt" href="${SOCIAL_LINKS.youtube}" target="_blank" rel="noopener">▶</a></div><button class="icon-btn" data-action="notifications">♢</button></div></header><section id="pageContent"></section></main></div>`;go(state.page)}
function newsCard(n){return`<article class="news-card" data-news="${esc(n.id)}"><div class="news-image"></div><div class="news-body"><small>${esc(n.categoria||"Notícia")}</small><h3>${esc(n.titulo||n.title)}</h3><p>${esc(n.resumo||n.summary||"")}</p><div class="modal-actions"><button class="btn btn-ghost" data-favorite-type="news" data-favorite-id="${esc(n.id)}">☆ Favoritar</button></div></div></article>`}function projectCard(p){const pct=Math.max(0,Math.min(100,Number(p.progresso??p.progress??0)));return`<article class="project-card" data-project="${esc(p.id)}"><div class="project-cover"><h3>${esc(p.titulo||p.title)}</h3></div><div class="project-body"><p>${esc(p.descricao||p.description||"")}</p><div class="bar"><i style="width:${pct}%"></i></div><div class="project-foot"><span>${pct}% concluído</span><span class="pill">${esc(p.status||"planejamento")}</span></div><div class="modal-actions"><button class="btn btn-ghost" data-favorite-type="project" data-favorite-id="${esc(p.id)}">☆ Favoritar</button></div></div></article>`}
function pageFrame(html,title,subtitle){document.getElementById("pageContent").innerHTML=`<section class="page active">${html}</section>`;document.getElementById("pageTitle").textContent=title;document.getElementById("pageSubtitle").textContent=subtitle}
function dashboard(){const ps=dataProjects(),ns=dataNews(),avg=ps.length?Math.round(ps.reduce((a,p)=>a+Number(p.progresso??p.progress??0),0)/ps.length):0;pageFrame(`<div class="stats"><div class="stat"><small>Meus projetos</small><b>${ps.length}</b><em>em acompanhamento</em></div><div class="stat"><small>Progresso médio</small><b>${avg}%</b><em>continue avançando</em></div><div class="stat"><small>Convites</small><b>0</b><em>nenhum pendente</em></div><div class="stat"><small>Notificações</small><b>0</b><em>tudo em dia</em></div></div><div class="dash-grid"><section class="card wide"><div class="card-head"><div><h2>Em destaque</h2><p>Notícias e projetos da comunidade</p></div></div><div class="carousel"><div class="carousel-track">${ns.map(n=>`<div class="slide"><div class="slide-image"></div><div class="slide-content"><small>${esc(n.categoria||"Destaque")}</small><h3>${esc(n.titulo||n.title)}</h3><p>${esc(n.resumo||n.summary||"")}</p><button class="btn btn-primary" style="width:max-content;margin-top:18px" data-news="${esc(n.id)}">Abrir notícia ›</button></div></div>`).join("")}</div><div class="arrows"><button data-carousel="prev">‹</button><button data-carousel="next">›</button></div></div></section><section class="card wide"><div class="card-head"><div><h2>Notícias</h2><p>Role para o lado para acompanhar as novidades</p></div><button class="btn btn-ghost" data-page="news">Ver todas</button></div><div class="horizontal">${ns.map(newsCard).join("")}</div></section><section class="card"><div class="card-head"><div><h2>Meus projetos</h2><p>Etapas e progresso</p></div><button class="btn btn-primary" data-action="new-project">＋ Novo projeto</button></div><div class="project-grid">${ps.slice(0,4).map(projectCard).join("")}</div></section><section class="card"><div class="card-head"><div><h2>Interações</h2><p>Continue participando</p></div></div><div class="notice"><strong>Encontre colaboradores</strong><p>Usuários com interesses e participação semelhantes poderão ser sugeridos aqui.</p><button class="btn btn-secondary" data-action="recommendations">Ver sugestões</button></div></section></div>`,`Olá, ${esc((state.profile?.nome||"usuário").split(" ")[0])}!`,"Bem-vindo ao seu espaço de projetos.")}
function projectsPage(){pageFrame(`<div class="card"><div class="card-head"><div><h2>Projetos</h2><p>Crie, explore e acompanhe projetos.</p></div><button class="btn btn-primary" data-action="new-project">＋ Novo projeto</button></div><div class="toolbar"><input class="input" id="projectSearch" placeholder="Buscar projeto"><select class="select" id="projectFilter"><option value="">Todos os status</option><option value="planejamento">Planejamento</option><option value="em_andamento">Em andamento</option><option value="em_testes">Em testes</option><option value="concluido">Concluído</option></select></div><div class="project-grid" id="projectList">${dataProjects().map(projectCard).join("")}</div></div>`,'Projetos','Ideias que viram experiências.');projectSearch.oninput=filterProjects;projectFilter.onchange=filterProjects}function filterProjects(){const q=projectSearch.value.toLowerCase(),s=projectFilter.value;const list=dataProjects().filter(p=>(p.titulo||p.title||"").toLowerCase().includes(q)&&(!s||p.status===s));projectList.innerHTML=list.length?list.map(projectCard).join(""):`<div class="empty">Nenhum projeto encontrado.</div>`}
function newsPage(){pageFrame(`<div class="card"><div class="card-head"><div><h2>Notícias</h2><p>Atualizações, destaques e novidades.</p></div><button class="btn btn-primary" data-action="new-news">＋ Nova notícia</button></div><div class="horizontal">${dataNews().map(newsCard).join("")}</div><h3 style="color:var(--p);margin-top:27px">Mais recentes</h3><div class="list">${dataNews().map(n=>`<div class="list-item" data-news="${esc(n.id)}"><div class="news-image" style="width:62px;height:62px;flex:0 0 62px;border-radius:10px"></div><div><h3>${esc(n.titulo||n.title)}</h3><p>${esc(n.resumo||n.summary||"")}</p></div></div>`).join("")}</div></div>`,'Notícias','Acompanhe o que está acontecendo no Tecna.')}
function favoritesPage(){const fav=state.favorites;pageFrame(`<div class="card"><div class="card-head"><div><h2>Favoritos</h2><p>Projetos e notícias salvos por você.</p></div></div>${fav.length?`<div class="list">${fav.map(f=>`<div class="list-item"><div><h3>${esc(f.title)}</h3><p>${esc(f.type)} · salvo recentemente</p></div><button class="btn btn-ghost" data-unfavorite="${esc(f.id)}">★ Remover</button></div>`).join("")}</div>`:`<div class="empty">Você ainda não favoritou nenhum projeto ou notícia.</div>`}</div>`,'Favoritos','Consulte seus conteúdos salvos.')}
function votingPage(){pageFrame(`<div class="card"><div class="card-head"><div><h2>Destaque do mês</h2><p>Vote no projeto que merece reconhecimento.</p></div></div><div class="notice">A votação será carregada do banco quando houver uma votação publicada.</div><div class="project-grid" style="margin-top:17px">${dataProjects().map(p=>`<article class="project-card"><div class="project-cover"><h3>${esc(p.titulo||p.title)}</h3></div><div class="project-body"><p>${esc(p.descricao||p.description)}</p><button class="btn btn-secondary full" data-vote="${esc(p.id)}">♡ Votar</button></div></article>`).join("")}</div></div>`,'Destaque do mês','A comunidade escolhe em conjunto.')}
function suggestionsPage(){pageFrame(`<div class="card"><div class="card-head"><div><h2>Sugestões</h2><p>Ajude a construir o Tecna.</p></div><button class="btn btn-primary" data-action="new-suggestion">＋ Nova sugestão</button></div><div class="empty">Nenhuma sugestão registrada nesta sessão.</div></div>`,'Sugestões','Sua ideia pode melhorar a plataforma.')}
function profilePage(){const p=state.profile||state.user||{};pageFrame(`<div class="card"><div class="profile-head">${avatar(p,true)}<div><h2>${esc(p.nome||p.name||"Usuário")}</h2><p>@${esc(p.username||"usuário")} · ${esc(p.curso||"Sem curso")}</p></div><button class="btn btn-secondary" style="margin-left:auto" data-action="edit-profile">Editar perfil</button></div><div class="form-grid" style="margin-top:22px"><div class="field"><label>E-mail</label><div class="input muted">${esc(p.email||state.user?.email||"Não informado")}</div></div><div class="field"><label>Tipo de conta</label><div class="input muted">${esc(roleLabel(p.tipo_usuario||p.tipo))}</div></div></div></div>`,'Meu perfil','Gerencie suas informações e seu avatar.')}
function teacherPage(){pageFrame(`<div class="card"><div class="card-head"><div><h2>Área do professor</h2><p>Orientações e projetos acompanhados.</p></div></div><div class="tabs"><button class="btn btn-secondary">Convites recebidos</button><button class="btn btn-ghost">Minhas orientações</button><button class="btn btn-ghost">Solicitar orientação</button></div><div class="empty">Convites e solicitações serão carregados do Supabase.</div></div>`,'Área do professor','Acompanhe orientações e colaborações.')}
function adminPage(){pageFrame(`<div class="card"><div class="card-head"><div><h2>Painel administrativo</h2><p>Gerencie a comunidade Tecna.</p></div></div><div class="stats"><div class="stat"><small>Usuários</small><b>0</b></div><div class="stat"><small>Projetos pendentes</small><b>0</b></div><div class="stat"><small>Notícias</small><b>0</b></div><div class="stat"><small>Denúncias</small><b>0</b></div></div><div class="tabs"><button class="btn btn-secondary">Usuários</button><button class="btn btn-ghost">Projetos</button><button class="btn btn-ghost">Notícias</button><button class="btn btn-ghost">Votações</button><button class="btn btn-ghost">Moderação</button><button class="btn btn-ghost">Auditoria</button></div><div class="empty">Os dados administrativos serão carregados com permissões RLS.</div></div>`,'Administração','Gestão e moderação da plataforma.')}
function go(page){state.page=page;({dashboard,projects:projectsPage,news:newsPage,favorites:favoritesPage,voting:votingPage,suggestions:suggestionsPage,profile:profilePage,teacher:teacherPage,admin:adminPage}[page]||dashboard)();document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("sidebar")?.classList.remove("open")}
function modal(title,body){modalRoot.innerHTML=`<div class="modal-bg" data-close-modal><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" data-close-modal>×</button></div>${body}</div></div>`}function closeModal(){modalRoot.innerHTML=""}
function registerModal(){modal('Criar conta',`<form id="registerForm"><div class="form-grid"><div class="field"><label>Nome completo</label><input class="input" name="nome" required></div><div class="field"><label>Username</label><input class="input" name="username" id="username" pattern="[A-Za-z0-9_]+" required><span class="availability" id="usernameState">Digite para receber sugestões.</span></div><div class="field span-2"><label>E-mail</label><input class="input" type="email" name="email" required></div><div class="field"><label>Senha</label><input class="input" type="password" name="password" minlength="6" required></div><div class="field"><label>Tipo de conta</label><div class="role-grid"><button class="role selected" type="button" data-role="aluno"><strong>Aluno</strong><small>Cria e participa</small></button><button class="role" type="button" data-role="professor"><strong>Professor</strong><small>Orienta projetos</small></button></div><input type="hidden" name="tipo" value="aluno"></div><div class="field span-2" id="courseField"><label>Curso</label><select class="select" name="curso"><option>Marketing</option><option>Administração</option><option>Informática</option><option>Informática para Internet</option></select></div></div><p id="registerMessage" class="message"></p><button class="btn btn-primary full">Criar conta</button></form>`);document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-role]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('[name=tipo]').value=b.dataset.role;courseField.classList.toggle('hidden',b.dataset.role!=='aluno')});username.oninput=debounce(checkUsername,450)}async function checkUsername(){const i=document.getElementById('username'),out=document.getElementById('usernameState');i.value=i.value.toLowerCase().replace(/[^a-z0-9_]/g,'');if(i.value.length<3){out.textContent='Use pelo menos 3 caracteres.';out.className='availability bad';return}const suggestions=[i.value+'01',i.value+'_tecna',i.value+new Date().getFullYear()];if(!supabaseClient){out.textContent='Sugestões: '+suggestions.join(' · ');out.className='availability ok';return}const r=await supabaseClient.from('profiles').select('id').ilike('username',i.value).maybeSingle();if(r.data){out.textContent='Username ocupado. Sugestões: '+suggestions.join(' · ');out.className='availability bad'}else{out.textContent='Username disponível. Sugestões: '+suggestions.join(' · ');out.className='availability ok'}}function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
function projectModal(){modal('Novo projeto',`<form id="projectForm"><div class="form-grid"><div class="field span-2"><label>Título</label><input class="input" name="titulo" required></div><div class="field span-2"><label>Descrição</label><textarea class="textarea" name="descricao" required></textarea></div><div class="field"><label>Objetivo</label><input class="input" name="objetivo"></div><div class="field"><label>Área</label><select class="select" name="area"><option>Informática</option><option>Marketing</option><option>Administração</option></select></div><div class="field"><label>Visibilidade</label><select class="select" name="tipo_participacao"><option value="aberto">Público</option><option value="fechado">Privado</option></select></div><div class="field"><label>Capa</label><input class="input" type="file" name="capa" accept="image/*"></div><div class="field span-2"><label>Etapas</label><div class="steps">${defaultSteps.map((s,i)=>`<label class="step"><input type="checkbox" name="step" value="${i}"> ${s}</label>`).join('')}</div><small class="muted">O progresso será calculado automaticamente.</small></div><div class="field span-2"><label>Convidar participantes ou professores</label><input class="input" name="inviteSearch" placeholder="Pesquise pelo username após conectar o banco"><div class="people" id="people"></div></div></div><p class="message" id="projectMessage"></p><button class="btn btn-primary full">Criar projeto</button></form>`)}async function createProject(e){e.preventDefault();const f=e.currentTarget,msg=document.getElementById('projectMessage');if(!supabaseClient){msg.textContent='Configure o Supabase e execute o SQL para criar projetos reais.';return}const selected=[...f.querySelectorAll('[name=step]:checked')].map(x=>({titulo:defaultSteps[Number(x.value)],ordem:Number(x.value)+1,concluida:true}));const r=await supabaseClient.from('projects').insert({titulo:f.titulo.value,descricao:f.descricao.value,objetivo:f.objetivo.value,area:f.area.value,tipo_participacao:f.tipo_participacao.value,autora_id:state.user.id,progresso:Math.round(selected.length/defaultSteps.length*100),status:'planejamento'}).select().single();if(r.error){msg.textContent=apiError(r.error);return}if(selected.length)await supabaseClient.from('project_steps').insert(selected.map(x=>({...x,project_id:r.data.id})));closeModal();await boot();showToast('Projeto criado com sucesso.')}
function newsModal(){modal('Nova notícia',`<form id="newsForm"><div class="field"><label>Título</label><input class="input" name="titulo" required></div><div class="field"><label>Resumo</label><textarea class="textarea" name="resumo" required></textarea></div><div class="field"><label>Conteúdo</label><textarea class="textarea" name="conteudo" required></textarea></div><button class="btn btn-primary full">Salvar rascunho</button></form>`)}async function createNews(e){e.preventDefault();if(!supabaseClient){showToast('Configure o Supabase para criar notícias.');return}const f=e.currentTarget,r=await supabaseClient.from('news').insert({titulo:f.titulo.value,resumo:f.resumo.value,conteudo:f.conteudo.value,autor_id:state.user.id,status:'rascunho'});if(r.error){showToast(apiError(r.error));return}closeModal();showToast('Rascunho salvo.')}
function suggestionModal(){modal('Nova sugestão',`<form id="suggestionForm"><div class="field"><label>Tipo</label><select class="select" name="tipo"><option>Melhoria visual</option><option>Nova funcionalidade</option><option>Correção</option><option>Outra sugestão</option></select></div><div class="field"><label>Título</label><input class="input" name="titulo" required></div><div class="field"><label>Descrição</label><textarea class="textarea" name="conteudo" required></textarea></div><button class="btn btn-primary full">Enviar sugestão</button></form>`)}
async function register(e){e.preventDefault();const f=e.currentTarget,msg=document.getElementById('registerMessage');if(!supabaseClient){msg.textContent='Configure o Supabase antes do cadastro.';return}const r=await supabaseClient.auth.signUp({email:f.email.value,password:f.password.value,options:{data:{nome:f.nome.value,username:f.username.value,tipo_solicitado:f.tipo.value,curso:f.tipo.value==='aluno'?f.curso.value:null}}});if(r.error){msg.textContent=apiError(r.error);return}closeModal();showToast('Cadastro criado. Confirme o e-mail.')}
async function favorite(type,id){if(!supabaseClient){showToast('Favoritos persistentes dependem do Supabase.');return}const r=await supabaseClient.from('favorites').insert({user_id:state.user.id,project_id:type==='project'?id:null,news_id:type==='news'?id:null});if(r.error&&r.code!=='23505'){showToast(apiError(r));return}showToast('Adicionado aos favoritos.');await loadData();go(state.page)}async function loadData(){if(!supabaseClient)return;const [p,pr,n,f]=await Promise.all([supabaseClient.from('profiles').select('*').eq('id',state.user.id).maybeSingle(),supabaseClient.from('projects').select('*').order('created_at',{ascending:false}),supabaseClient.from('news').select('*').eq('status','publicado').order('created_at',{ascending:false}),supabaseClient.from('favorites').select('*').eq('user_id',state.user.id)]);if(p.data)state.profile=p.data;if(!pr.error)state.projects=pr.data||[];if(!n.error)state.news=n.data||[];if(!f.error)state.favorites=f.data||[]}
async function boot(){if(!supabaseClient){renderLogin();return}const s=await supabaseClient.auth.getSession();if(!s.data.session){renderLogin();return}state.user=s.data.session.user;await loadData();shell()}
document.addEventListener('submit',e=>{if(e.target.id==='loginForm')login(e);if(e.target.id==='registerForm')register(e);if(e.target.id==='projectForm')createProject(e);if(e.target.id==='newsForm')createNews(e)});document.addEventListener('click',e=>{const p=e.target.closest('[data-page]'),a=e.target.closest('[data-action]'),o=e.target.closest('[data-oauth]'),fav=e.target.closest('[data-favorite-type]'),n=e.target.closest('[data-news]'),pr=e.target.closest('[data-project]'),v=e.target.closest('[data-vote]'),t=e.target.closest('[data-toggle-password]');if(p){e.preventDefault();go(p.dataset.page)}if(o)oauth(o.dataset.oauth);if(t){const input=t.previousElementSibling;input.type=input.type==='password'?'text':'password'}if(fav){e.stopPropagation();favorite(fav.dataset.favoriteType,fav.dataset.favoriteId)}if(a){const x=a.dataset.action;if(x==='register')registerModal();if(x==='new-project')projectModal();if(x==='new-news')newsModal();if(x==='new-suggestion')suggestionModal();if(x==='menu')document.getElementById('sidebar')?.classList.toggle('open');if(x==='logout'){supabaseClient?.auth.signOut();state.user=null;renderLogin()}if(x==='notifications')showToast('As notificações aparecerão aqui.');if(x==='recommendations')showToast('As recomendações aparecerão aqui.');if(x==='request')showToast('Pedido de participação será enviado quando o banco estiver conectado.');if(x==='edit-profile')showToast('O editor de perfil será aberto pelo módulo de perfil.')}if(v)showToast('Seu voto será salvo quando houver uma votação ativa.');if(n){const x=dataNews().find(y=>String(y.id)===String(n.dataset.news));if(x)modal(esc(x.titulo||x.title),`<p class="kicker">${esc(x.categoria||'Notícia')}</p><p style="line-height:1.7">${esc(x.conteudo||x.resumo||x.summary||'')}</p><div class="modal-actions"><button class="btn btn-secondary" data-action="like">♡ Curtir</button><button class="btn btn-ghost" data-action="comment">💬 Comentar</button><button class="btn btn-ghost" data-favorite-type="news" data-favorite-id="${esc(x.id)}">☆ Favoritar</button></div>`)}if(pr){const x=dataProjects().find(y=>String(y.id)===String(pr.dataset.project));if(x)modal(esc(x.titulo||x.title),`<div class="detail-hero"><h2>${esc(x.titulo||x.title)}</h2></div><p style="line-height:1.7">${esc(x.descricao||x.description||'')}</p><div class="bar"><i style="width:${x.progresso||x.progress||0}%"></i></div><p class="muted">${x.progresso||x.progress||0}% concluído</p><div class="steps">${defaultSteps.map(s=>`<label class="step"><input type="checkbox"> ${s}</label>`).join('')}</div><div class="modal-actions"><button class="btn btn-secondary" data-action="request">Pedir para participar</button><button class="btn btn-ghost" data-favorite-type="project" data-favorite-id="${esc(x.id)}">☆ Favoritar</button><button class="btn btn-ghost" data-action="like">♡ Curtir</button></div><div class="field" style="margin-top:15px"><label>Comentário</label><textarea class="textarea" placeholder="Escreva um comentário"></textarea><button class="btn btn-primary" style="margin-top:8px" data-action="comment">Publicar comentário</button></div>`)} });modalRoot.addEventListener('click',e=>{if(e.target.hasAttribute('data-close-modal'))closeModal()});
(async()=>{renderLogin();if(isConfigured)await boot()})();
</script>
