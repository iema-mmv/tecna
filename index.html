function esc(v){return String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;",'"':"&quot;"}[c]))}function toastMessage(v){toast.textContent=v;toast.classList.add("show");clearTimeout(toastMessage.timer);toastMessage.timer=setTimeout(()=>toast.classList.remove("show"),4500)}function brand(c="brand-logo"){return`<img class="${c}" src="${LOGO_PATH}" alt="Tecna — projetos que conectam" onerror="this.style.display='none'">`}function avatar(u){return`<span class="avatar">${u?.foto_url?`<img src="${esc(u.foto_url)}" alt="Foto de ${esc(u.nome||"usuário")}">`:esc(u?.avatar||"✦")}</span>`}function authError(e){const m=e?.message||"Erro desconhecido.";if(m.includes("Email not confirmed"))return"O e-mail ainda não foi confirmado.";if(m.includes("Invalid login credentials"))return"Usuário ou e-mail incorretos.";if(m.includes("already registered"))return"Este e-mail já possui cadastro.";return m}
function renderLogin(){app.innerHTML=`<section class="login-screen"><section class="login-visual" aria-hidden="true"><canvas id="network-canvas"></canvas><div class="visual-content">${brand("brand-logo visual-logo")}<div class="hero-copy"><p class="eyebrow">Comunidade estudantil</p><h1>Ideias que se conectam.</h1><p>Crie, acompanhe e compartilhe projetos que transformam o futuro da tecnologia.</p><div class="hero-keywords"><span>✦ Criar</span><span>↗ Colaborar</span><span>♡ Aprender</span></div></div><small>Um espaço para dar visibilidade ao talento e à criatividade.</small></div></section><section class="login-panel"><div class="auth-card"><div class="mobile-brand">${brand("brand-logo mobile-logo")}</div><p class="eyebrow">Acesso à plataforma</p><h2>Bem-vindo ao Tecna</h2><p class="auth-intro">Entre para acompanhar e compartilhar projetos.</p><form id="login-form"><div class="form-group"><label>E-mail ou nome de usuário</label><input class="input" name="identifier" autocomplete="username" placeholder="voce@exemplo.com ou seu_usuario" required></div><div class="form-group"><label>Senha</label><div class="input-wrap"><input class="input password-input" name="password" type="password" minlength="6" placeholder="Digite sua senha" required><button class="toggle-password" type="button" data-toggle-password="login-password">◉</button></div></div><div class="password-row"><label class="checkbox-label"><input type="checkbox"> Lembrar de mim</label><button class="text-button" type="button" data-action="forgot-password">Esqueci minha senha</button></div><p id="login-message" class="auth-message"></p><button class="primary-button" type="submit">Entrar</button></form><div class="auth-divider">ou</div><button class="secondary-button" type="button" data-action="create-account" style="width:100%">Criar uma conta</button><p class="auth-footer">Plataforma educacional Tecna.</p></div></section></section>`;document.querySelector("#login-form input[name=password]").id="login-password";initCanvas()}
function title(){return({dashboard:`Olá, ${(state.currentUser?.nome||"usuário").split(" ")[0]}!`,projects:"Projetos",suggestions:"Sugerir melhoria",profile:"Meu perfil"})[state.currentPage]||"Olá!"}function subtitle(){return({dashboard:"Acompanhe suas ideias e descubra novos projetos.",projects:"Explore projetos, equipes e ideias da comunidade.",suggestions:"Ajude a melhorar o Tecna com uma sugestão.",profile:"Apresente sua trajetória e seus interesses."})[state.currentPage]||""}function renderApp(){app.innerHTML=`<div class="app-layout"><aside class="sidebar">${brand("brand-logo sidebar-logo")}<nav class="sidebar-nav"><button class="nav-item ${state.currentPage==="dashboard"?"active":""}" data-page="dashboard">⌂　Visão geral</button><button class="nav-item ${state.currentPage==="projects"?"active":""}" data-page="projects">▣　Projetos</button><button class="nav-item ${state.currentPage==="suggestions"?"active":""}" data-page="suggestions">✎　Sugerir melhoria</button><button class="nav-item ${state.currentPage==="profile"?"active":""}" data-page="profile">♙　Meu perfil</button></nav><div class="sidebar-bottom"><div class="profile-mini">${avatar(state.currentUser)}<div><strong>${esc(state.currentUser?.nome||"Novo usuário")}</strong><small>@${esc(state.currentUser?.username||"usuário")}</small></div></div><button class="logout-button" data-action="logout">↪ Sair da conta</button></div></aside><section class="main-content"><header class="topbar"><div><button class="icon-button menu-button" data-action="toggle-menu">☰</button><h1>${title()}</h1><p>${subtitle()}</p></div><button class="icon-button" data-action="notifications">♧</button></header>${currentPage()}</section></div>`}function currentPage(){if(state.currentPage==="projects")return projectsPage();if(state.currentPage==="suggestions")return suggestionsPage();if(state.currentPage==="profile")return profilePage();return dashboard()}function projectCard(p){return`<article class="project-card"><div class="project-cover"><h3>${esc(p.titulo)}</h3></div><div class="project-body"><p>${esc(p.descricao)}</p><div class="progress-row"><span>Progresso</span><span>${p.progresso||0}%</span></div><div class="progress-track"><div class="progress-bar" style="width:${p.progresso||0}%"></div></div><div class="project-meta"><span>${esc(p.area)}</span><span class="status-pill">${esc(p.status||"planejamento")}</span></div></div></article>`}function dashboard(){return`<section class="page-section active"><div class="stats-grid"><article class="stat-card"><span class="stat-label">Meus projetos</span><div class="stat-value">${state.projects.length}</div><div class="stat-trend">Projetos cadastrados</div></article><article class="stat-card"><span class="stat-label">Progresso médio</span><div class="stat-value">${state.projects.length?Math.round(state.projects.reduce((s,p)=>s+(p.progresso||0),0)/state.projects.length):0}%</div><div class="stat-trend">Baseado nos seus projetos</div></article><article class="stat-card"><span class="stat-label">Sugestões enviadas</span><div class="stat-value">${state.suggestions.length}</div><div class="stat-trend">Sua participação</div></article></div><div class="dashboard-grid"><article class="content-card"><div class="card-heading"><div><h2>Continue sua jornada</h2><p>Retome um projeto ou descubra uma nova ideia.</p></div><button class="link-button" data-page="projects">Ver todos</button></div><div class="project-grid">${state.projects.length?state.projects.slice(0,3).map(projectCard).join(""):`<div class="empty-state" style="grid-column:1/-1">Você ainda não cadastrou nenhum projeto.<br><button class="primary-button" data-page="projects" style="margin-top:16px;width:auto">Cadastrar projeto</button></div>`}</div></article><div style="display:grid;gap:22px"><article class="content-card"><h2>Ajude a melhorar o Tecna</h2><p>Tem uma ideia para deixar a plataforma melhor?</p><button class="primary-button" data-page="suggestions">Sugerir melhoria</button></article></div></div><h2 class="section-label">Descubra projetos</h2><div class="horizontal-scroll">${state.projects.map(projectCard).join("")||`<div class="content-card empty-state">Nenhum projeto publicado ainda.</div>`}</div></section>`}function projectsPage(){return`<section class="page-section active"><div class="toolbar"><input class="input" id="project-search" placeholder="Buscar projeto..."><select class="select" id="project-filter"><option value="all">Todas as áreas</option><option>Sustentabilidade</option><option>Robótica</option><option>Aplicativos</option><option>Cultura</option><option>Inteligência artificial</option></select><button class="primary-button" data-action="create-project">+ Cadastrar projeto</button></div><div class="project-grid">${state.projects.map(projectCard).join("")||`<div class="empty-state" style="grid-column:1/-1">Nenhum projeto cadastrado ainda.</div>`}</div></section>`}function suggestionsPage(){return`<section class="page-section active"><article class="content-card"><h2>Envie sua sugestão</h2><p>Conte o que pode melhorar no Tecna.</p><form id="suggestion-form"><div class="form-group"><label>Tipo de sugestão</label><select class="select" id="suggestion-type"><option>Melhoria visual</option><option>Nova funcionalidade</option><option>Correção</option><option>Outra sugestão</option></select></div><div class="form-group"><label>Título</label><input class="input" id="suggestion-title" required></div><div class="form-group"><label>Descrição</label><textarea class="textarea" id="suggestion-description" required></textarea></div><button class="primary-button" type="submit">Enviar sugestão</button></form></article><h2 class="section-label">Minhas sugestões</h2><div class="suggestion-list">${state.suggestions.map(s=>`<article class="suggestion-item"><strong>${esc(s.titulo)}</strong><small>${esc(s.tipo)} · ${esc(s.descricao)}</small></article>`).join("")||`<div class="content-card empty-state">Você ainda não enviou sugestões.</div>`}</div></section>`}function profilePage(){const u=state.currentUser||{};return`<section class="page-section active"><article class="content-card"><h2>${esc(u.nome||"Novo usuário")}</h2><p>@${esc(u.username||"usuário")} · ${esc(u.curso||"Curso não informado")}</p><div class="profile-photo-area"><div id="profile-photo-preview" class="profile-photo-preview">${u.foto_url?`<img src="${esc(u.foto_url)}" alt="Foto de perfil">`:esc(u.avatar||"✦")}</div><div><strong>Foto de perfil</strong><input class="file-input" type="file" id="profile-photo" accept="image/*"><small>Escolha uma imagem para o seu avatar.</small></div></div><div class="form-grid"><div class="form-group"><label>Nome completo</label><input class="input" id="profile-name" value="${esc(u.nome||"")}"></div><div class="form-group"><label>Nome de usuário</label><input class="input" id="profile-username" value="${esc(u.username||"")}"></div><div class="form-group full"><label>Curso</label><input class="input" id="profile-course" value="${esc(u.curso||"")}"></div></div><button class="primary-button" data-action="save-profile">Salvar alterações</button></article></section>`}
function openModal(type){if(type==="account")modalRoot.innerHTML=`<div class="modal-backdrop" data-close-modal><section class="modal"><div class="modal-header"><div><p class="eyebrow">Faça parte da comunidade</p><h2>Criar uma conta</h2></div><button class="close-button" data-close-modal>×</button></div><div class="role-choice"><button type="button" class="role-option selected" data-role-choice="aluna"><strong>Cadastro para aluna</strong><small>Crie projetos e participe da comunidade.</small></button><button type="button" class="role-option" data-role-choice="professores"><strong>Cadastro para professores</strong><small>Oriente projetos após aprovação administrativa.</small></button></div><form id="account-form"><input type="hidden" id="account-role" value="aluna"><div class="form-grid"><div class="form-group full"><label>Nome completo</label><input class="input" id="account-name" required></div><div class="form-group full"><label>Nome de usuário</label><input class="input" id="account-username" pattern="[a-z0-9.]{3,30}" placeholder="ex: sidney" required></div><div class="form-group"><label>E-mail</label><input class="input" id="account-email" type="email" required></div><div class="form-group"><label>Senha</label><input class="input" id="account-password" type="password" minlength="6" required></div><div class="form-group full" id="account-course-group"><label>Curso</label><div class="course-choice-grid"><label class="course-option"><input type="radio" name="account-course" value="Marketing"><span>Marketing</span></label><label class="course-option"><input type="radio" name="account-course" value="Administração"><span>Administração</span></label><label class="course-option"><input type="radio" name="account-course" value="Informática"><span>Informática</span></label><label class="course-option"><input type="radio" name="account-course" value="Informática para Internet"><span>Informática para Internet</span></label></div></div></div><p id="account-message" class="auth-message"></p><button class="primary-button" type="submit">Criar conta</button></form></section></div>`;if(type==="forgot")modalRoot.innerHTML=`<div class="modal-backdrop" data-close-modal><section class="modal"><div class="modal-header"><h2>Esqueci minha senha</h2><button class="close-button" data-close-modal>×</button></div><form id="forgot-form"><div class="form-group"><label>E-mail</label><input class="input" id="forgot-email" type="email" required></div><button class="primary-button" type="submit">Enviar instruções</button></form></section></div>`;if(type==="project")modalRoot.innerHTML=`<div class="modal-backdrop" data-close-modal><section class="modal"><div class="modal-header"><h2>Cadastrar projeto</h2><button class="close-button" data-close-modal>×</button></div><form id="project-form"><div class="form-grid"><div class="form-group full"><label>Nome do projeto</label><input class="input" id="project-title" required></div><div class="form-group"><label>Área</label><select class="select" id="project-area"><option>Tecnologia</option><option>Educação</option><option>Sustentabilidade</option><option>Robótica</option><option>Aplicativos</option></select></div><div class="form-group full"><label>Descrição</label><textarea class="textarea" id="project-description" required></textarea></div></div><button class="primary-button" type="submit">Cadastrar projeto</button></form></section></div>`}
function closeModal(){modalRoot.innerHTML=""}async function loadUser(){const{data:{session}}=await supabaseClient.auth.getSession();if(session){state.loggedIn=true;await loadProfile(session.user);await loadData();renderApp()}else renderLogin();supabaseClient.auth.onAuthStateChange(async(e,s)=>{if(e==="SIGNED_OUT"){state.loggedIn=false;state.currentUser=null;renderLogin()}if(e==="SIGNED_IN"&&s){state.loggedIn=true;await loadProfile(s.user);await loadData();renderApp()}})}async function loadProfile(u){const{data}=await supabaseClient.from("profiles").select("*").eq("id",u.id).maybeSingle();state.currentUser=data||{id:u.id,nome:u.user_metadata?.nome||"Novo usuário",username:u.user_metadata?.username||"",email:u.email,curso:u.user_metadata?.curso||"",avatar:"✦"}}async function loadData(){const{data:projects}=await supabaseClient.from("projects").select("*").or(`status_publicacao.eq.publicado,autora_id.eq.${state.currentUser.id}`).order("created_at",{ascending:false});state.projects=projects||[]}async function findEmail(u){const{data}=await supabaseClient.from("profiles").select("email").eq("username",u).maybeSingle();return data?.email||null}async function login(e){e.preventDefault();const f=e.currentTarget,m=document.getElementById("login-message"),id=f.identifier.value.trim(),pw=f.password.value,email=id.includes("@")?id:await findEmail(id);if(!email){m.textContent="Usuário ou e-mail não encontrado.";return}const{error}=await supabaseClient.auth.signInWithPassword({email,password:pw});if(error)m.textContent=authError(error)}async function submitAccount(e){e.preventDefault();const m=document.getElementById("account-message"),name=document.getElementById("account-name").value.trim(),username=document.getElementById("account-username").value.trim().toLowerCase(),email=document.getElementById("account-email").value.trim(),password=document.getElementById("account-password").value,role=document.getElementById("account-role").value,course=document.querySelector('input[name="account-course"]:checked')?.value;if(!/^[a-z0-9.]{3,30}$/.test(username)){m.textContent="Use letras minúsculas, números opcionais e ponto.";return}if(role==="aluna"&&!course){m.textContent="Selecione um curso.";return}const{data:exists}=await supabaseClient.from("profiles").select("id").eq("username",username).maybeSingle();if(exists){m.textContent="Esse usuário já está em uso.";return}const{error}=await supabaseClient.auth.signUp({email,password,options:{data:{nome:name,username,curso:role==="aluna"?course:null,tipo_solicitado:role},emailRedirectTo:SITE_URL}});if(error){m.textContent=authError(error);return}closeModal();toastMessage(role==="professores"?"Cadastro de professores enviado para análise.":"Cadastro de aluna realizado.")}async function submitSuggestion(e){e.preventDefault();state.suggestions.unshift({tipo:document.getElementById("suggestion-type").value,titulo:document.getElementById("suggestion-title").value.trim(),descricao:document.getElementById("suggestion-description").value.trim()});renderApp();toastMessage("Sugestão registrada.")}async function saveProfile(){const file=document.getElementById("profile-photo")?.files?.[0],payload={nome:document.getElementById("profile-name").value.trim(),username:document.getElementById("profile-username").value.trim().toLowerCase(),curso:document.getElementById("profile-course").value.trim()};if(file){const reader=new FileReader();reader.onload=()=>{state.currentUser={...state.currentUser,...payload,foto_url:reader.result};renderApp();toastMessage("Foto e perfil atualizados nesta sessão.")};reader.readAsDataURL(file);return}const{data,error}=await supabaseClient.from("profiles").update(payload).eq("id",state.currentUser.id).select().single();if(error){toastMessage(error.message);return}state.currentUser=data;renderApp();toastMessage("Perfil atualizado.")}async function reset(e){e.preventDefault();const{error}=await supabaseClient.auth.resetPasswordForEmail(document.getElementById("forgot-email").value,{redirectTo:SITE_URL});closeModal();toastMessage(error?authError(error):"Confira seu e-mail.")}
function initCanvas(){const c=document.getElementById("network-canvas");if(!c)return;const x=c.getContext("2d"),pts=[];let w=0,h=0;function size(){w=c.clientWidth;h=c.clientHeight;c.width=w*devicePixelRatio;c.height=h*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio)}for(let i=0;i<55;i++)pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2});size();function draw(){x.clearRect(0,0,w,h);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;x.fillStyle="#A8D719";x.beginPath();x.arc(p.x,p.y,2,0,7);x.fill()});requestAnimationFrame(draw)}draw()}function action(a){if(a==="create-account")openModal("account");if(a==="create-project")openModal("project");if(a==="forgot-password")openModal("forgot");if(a==="logout")supabaseClient.auth.signOut();if(a==="toggle-menu")document.querySelector(".sidebar")?.classList.toggle("open");if(a==="notifications")toastMessage("Você não tem novas notificações.");if(a==="save-profile")saveProfile()}function go(p){state.currentPage=p;renderApp();scrollTo({top:0,behavior:"smooth"})}
document.addEventListener("submit",e=>{if(e.target.id==="login-form")login(e);if(e.target.id==="account-form")submitAccount(e);if(e.target.id==="forgot-form")reset(e);if(e.target.id==="suggestion-form")submitSuggestion(e)});document.addEventListener("click",e=>{const a=e.target.closest("[data-action]"),p=e.target.closest("[data-page]"),r=e.target.closest("[data-role-choice]"),t=e.target.closest("[data-toggle-password]");if(e.target.matches("[data-close-modal]")||e.target.closest("[data-close-modal]"))if(e.target.classList.contains("modal-backdrop")||e.target.closest(".close-button"))closeModal();if(r){document.querySelectorAll("[data-role-choice]").forEach(x=>x.classList.remove("selected"));r.classList.add("selected");const selectedRole=r.dataset.roleChoice;document.getElementById("account-role").value=selectedRole;const group=document.getElementById("account-course-group");if(selectedRole==="professores"){group.hidden=true;group.style.display="none"}else{group.hidden=false;group.style.display="block"}document.querySelectorAll('input[name="account-course"]').forEach(x=>{x.required=selectedRole==="aluna";if(selectedRole==="professores")x.checked=false})}if(a)action(a.dataset.action);if(p)go(p.dataset.page);if(t){const i=document.getElementById(t.dataset.togglePassword);i.type=i.type==="password"?"text":"password"}});document.addEventListener("change",e=>{if(e.target.id==="profile-photo"){const file=e.target.files?.[0],preview=document.getElementById("profile-photo-preview");if(file&&preview){const reader=new FileReader();reader.onload=()=>{preview.innerHTML=`<img src="${reader.result}" alt="Prévia da foto de perfil">`};reader.readAsDataURL(file)}}});loadUser();
</script>
