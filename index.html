)}
function pageTitle(){return({dashboard:`Olá, ${(state.currentUser?.nome||"estudante").split(" ")[0]}!`,projects:"Projetos",news:"Notícias do Tecna",voting:"Destaque do mês",suggestions:"Sugerir melhoria",profile:"Meu perfil"})[state.currentPage]||"Olá!"}function pageSub(){return({dashboard:"Acompanhe suas ideias e descubra novos projetos.",projects:"Explore projetos, equipes e ideias da comunidade.",news:"Acompanhe as novidades e conquistas da comunidade.",voting:"Reconheça projetos e estudantes que inspiram a comunidade.",suggestions:"Ajude a melhorar o Tecna com uma sugestão.",profile:"Apresente sua trajetória e seus interesses."})[state.currentPage]||""}function renderApp(){app.innerHTML=`<div class="app-layout"><aside class="sidebar" id="sidebar">${brand("brand-logo sidebar-logo")}<nav class="sidebar-nav"><button class="nav-item" data-page="dashboard">⌂　Visão geral</button><button class="nav-item" data-page="projects">▣　Projetos</button><button class="nav-item" data-page="news">✦　Notícias</button><button class="nav-item" data-page="voting">◉　Destaque do mês</button><button class="nav-item" data-page="suggestions">✎　Sugerir melhoria</button><button class="nav-item" data-page="profile">♙　Meu perfil</button></nav><div class="sidebar-bottom"><div class="profile-mini">${avatar(state.currentUser)}<div><strong>${esc(state.currentUser?.nome||"Usuário")}</strong><small>@${esc(state.currentUser?.username||"usuário")}</small></div></div><button class="logout-button" data-action="logout">↪ Sair da conta</button></div></aside><section class="main-content"><header class="topbar"><div><button class="icon-button menu-button" data-action="toggle-menu">☰</button><h1>${pageTitle()}</h1><p>${pageSub()}</p></div><div class="top-actions"><button class="icon-button" data-action="notifications">♧</button></div></header>${currentPage()}</section></div>`;document.querySelector(`[data-page="${state.currentPage}"]`)?.classList.add("active")}
function currentPage(){if(state.currentPage==="projects")return projectsPage();if(state.currentPage==="news")return newsPage();if(state.currentPage==="voting")return votingPage();if(state.currentPage==="suggestions")return suggestionsPage();if(state.currentPage==="profile")return profilePage();return dashboard()}function projectCard(p){return`<article class="project-card"><div class="project-cover" ${p.imagem_capa_url?`style="background-image:linear-gradient(135deg,rgba(50,16,71,.45),rgba(209,106,166,.35)),url('${esc(p.imagem_capa_url)}')"`:""}><h3>${esc(p.titulo)}</h3></div><div class="project-body"><p>${esc(p.descricao)}</p><div class="progress-row"><span>Progresso</span><span>${p.progresso||0}%</span></div><div class="progress-track"><div class="progress-bar" style="width:${p.progresso||0}%"></div></div><div class="project-meta"><span>${esc(p.area)}</span><span class="status-pill">${esc(p.status||"planejamento")}</span></div><button class="ghost-button" data-project-id="${p.id}" style="width:100%;margin-top:14px">Ver detalhes</button></div></article>`}function newsItem(n){return`<article class="news-item"><div class="news-thumb">✦</div><div><h3>${esc(n.titulo)}</h3><p>${esc(n.resumo||"")}</p><button class="link-button" data-news-id="${n.id}">Ler notícia</button></div></article>`}function carousel(){if(!state.news.length)return`<div class="content-card empty-state">As notícias aparecerão aqui.</div>`;return`<div class="news-carousel"><div id="news-track" class="news-track">${state.news.map(n=>`<article class="news-slide"><div class="news-slide-image"></div><div class="news-slide-content"><p class="eyebrow">Notícia Tecna</p><h3>${esc(n.titulo)}</h3><p>${esc(n.resumo||n.conteudo||"")}</p><button class="ghost-button" data-news-id="${n.id}">Ler notícia</button></div></article>`).join("")}</div><div class="carousel-controls"><button class="carousel-button" data-carousel="prev">‹</button><button class="carousel-button" data-carousel="next">›</button></div></div>`}function dashboard(){const avg=state.projects.length?Math.round(state.projects.reduce((a,p)=>a+(p.progresso||0),0)/state.projects.length):0;return`<section class="page-section active"><div class="stats-grid"><article class="stat-card"><span class="stat-label">Meus projetos</span><div class="stat-value">${state.projects.length}</div></article><article class="stat-card"><span class="stat-label">Projetos acompanhados</span><div class="stat-value">0</div></article><article class="stat-card"><span class="stat-label">Sugestões recebidas</span><div class="stat-value">${state.suggestions.length}</div></article><article class="stat-card"><span class="stat-label">Progresso médio</span><div class="stat-value">${avg}%</div></article></div><div class="dashboard-grid"><article class="content-card"><div class="card-heading"><div><h2>Continue sua jornada</h2><p>Retome um projeto ou descubra uma nova ideia.</p></div><button class="link-button" data-page="projects">Ver todos</button></div><div class="project-grid">${state.projects.length?state.projects.slice(0,3).map(projectCard).join(""):`<div class="empty-state" style="grid-column:1/-1">Você ainda não cadastrou nenhum projeto.<br><button class="primary-button" data-action="create-project" style="margin-top:16px;width:auto">Cadastrar projeto</button></div>`}</div></article><div style="display:grid;gap:22px"><article class="content-card"><h2>Destaque do mês</h2><p>Valorize projetos e estudantes da comunidade.</p><div class="poll-box"><h3>Projeto e aluno destaque</h3><p>Participe da escolha da comunidade.</p><button class="primary-button" data-page="voting">Conhecer destaques</button></div></article><article class="content-card"><div class="card-heading"><h2>Notícias recentes</h2><button class="link-button" data-page="news">Ver todas</button></div><div class="news-list">${state.news.slice(0,3).map(newsItem).join("")||`<div class="empty-state">As notícias aparecerão aqui.</div>`}</div></article></div></div><h2 class="section-label">Em destaque agora</h2>${carousel()}<h2 class="section-label">Descubra projetos</h2><div class="horizontal-scroll">${state.projects.map(projectCard).join("")||`<div class="content-card empty-state">Nenhum projeto publicado ainda.</div>`}</div></section>`}function projectsPage(){return`<section class="page-section active"><div class="toolbar"><input class="input" id="project-search" placeholder="Buscar projeto..."><select class="select" id="project-filter"><option value="all">Todas as áreas</option><option>Sustentabilidade</option><option>Robótica</option><option>Aplicativos</option><option>Cultura</option><option>Inteligência artificial</option></select><button class="primary-button" data-action="create-project">+ Cadastrar projeto</button></div><div id="projects-list" class="project-grid">${state.projects.map(projectCard).join("")||`<div class="empty-state" style="grid-column:1/-1">Nenhum projeto cadastrado ainda.</div>`}</div></section>`}function newsPage(){return`<section class="page-section active"><article class="content-card"><h2>Atualizações da comunidade</h2><p>Notícias de projetos, eventos e oportunidades.</p>${carousel()}</article></section>`}function votingPage(){return`<section class="page-section active"><article class="content-card"><h2>Destaque do mês</h2><p>Reconheça o projeto e o aluno que mais inspiraram a comunidade.</p><div class="poll-box"><h3>Projeto destaque do mês</h3><button class="ghost-button" data-action="coming-soon">Escolher projeto destaque</button><button class="ghost-button" data-action="coming-soon">Escolher aluno destaque</button></div></article></section>`}function suggestionsPage(){return`<section class="page-section active"><article class="content-card"><h2>Envie sua sugestão</h2><p>Conte o que pode melhorar no Tecna.</p><form id="suggestion-form"><div class="form-group"><label>Tipo de sugestão</label><select class="select" id="suggestion-type"><option>Melhoria visual</option><option>Nova funcionalidade</option><option>Correção</option><option>Outra sugestão</option></select></div><div class="form-group"><label>Título</label><input class="input" id="suggestion-title" required></div><div class="form-group"><label>Descrição</label><textarea class="textarea" id="suggestion-description" required></textarea></div><button class="primary-button" type="submit">Enviar sugestão</button></form></article></section>`}function profilePage(){const u=state.currentUser||{};return`<section class="page-section active"><article class="content-card"><h2>${esc(u.nome||"Usuário")}</h2><p>@${esc(u.username||"usuário")} · ${esc(u.curso||"Curso não informado")}</p><div class="profile-photo-area"><div id="profile-photo-preview" class="profile-photo-preview">${u.foto_url?`<img src="${esc(u.foto_url)}" alt="Foto">`:esc(u.avatar||"✦")}</div><div><strong>Foto de perfil</strong><input class="file-input" type="file" id="profile-photo" accept="image/*"></div></div><div class="form-grid"><div class="form-group"><label>Nome completo</label><input class="input" id="profile-name" value="${esc(u.nome||"")}"></div><div class="form-group"><label>Nome de usuário</label><input class="input" id="profile-username" value="${esc(u.username||"")}"></div><div class="form-group full"><label>Curso</label><input class="input" id="profile-course" value="${esc(u.curso||"")}"></div></div><button class="primary-button" data-action="save-profile">Salvar alterações</button></article></section>`}
function openModal(type){if(type==="account")modalRoot.innerHTML=`<div class="modal-backdrop" data-close-modal><section class="modal"><div class="modal-header"><h2>Criar uma conta</h2><button class="close-button" data-close-modal>×</button></div><div class="role-choice"><button class="role-option selected" type="button" data-role-choice="aluna"><strong>Cadastro para aluna</strong><small>Crie projetos e participe.</small></button><button class="role-option" type="button" data-role-choice="professores"><strong>Cadastro para professores</strong><small>Oriente projetos após aprovação.</small></button></div><form id="account-form"><input type="hidden" id="account-role" value="aluna"><div class="form-grid"><div class="form-group full"><label>Nome completo</label><input class="input" id="account-name" required></div><div class="form-group full"><label>Nome de usuário</label><input class="input" id="account-username" required></div><div class="form-group"><label>E-mail</label><input class="input" id="account-email" type="email" required></div><div class="form-group"><label>Senha</label><input class="input" id="account-password" type="password" minlength="6" required></div><div class="form-group full" id="account-course-group"><label>Curso</label><div class="course-choice-grid"><label class="course-option"><input type="radio" name="account-course" value="Marketing"><span>Marketing</span></label><label class="course-option"><input type="radio" name="account-course" value="Administração"><span>Administração</span></label><label class="course-option"><input type="radio" name="account-course" value="Informática"><span>Informática</span></label><label class="course-option"><input type="radio" name="account-course" value="Informática para Internet"><span>Informática para Internet</span></label></div></div></div><p id="account-message" class="auth-message"></p><button class="primary-button" type="submit">Criar conta</button></form></section></div>`;if(type==="forgot")modalRoot.innerHTML=`<div class="modal-backdrop" data-close-modal><section class="modal"><div class="modal-header"><h2>Recuperar senha</h2><button class="close-button" data-close-modal>×</button></div><form id="forgot-form"><div class="form-group"><label>E-mail da conta</label><input class="input" id="forgot-email" type="email" required></div><button class="primary-button" type="submit">Enviar instruções</button></form></section></div>`;if(type==="project")modalRoot.innerHTML=`<div class="modal-backdrop" data-close-modal><section class="modal"><div class="modal-header"><h2>Cadastrar projeto</h2><button class="close-button" data-close-modal>×</button></div><form id="project-form"><div class="form-grid"><div class="form-group full"><label>Nome do projeto</label><input class="input" id="project-title" required></div><div class="form-group"><label>Área</label><select class="select" id="project-area"><option>Tecnologia</option><option>Educação</option><option>Sustentabilidade</option><option>Robótica</option><option>Aplicativos</option></select></div><div class="form-group full"><label>Descrição</label><textarea class="textarea" id="project-description" required></textarea></div></div><div class="detail-block"><h3>Professores orientadores</h3><p>Quem você quer convidar para orientar seu projeto?</p><input class="input" id="teacher-search" placeholder="Buscar professores..."><div id="teacher-list" class="invite-list"></div><button type="button" class="secondary-button invite-button" data-invite-type="teacher">Convidar professores</button></div><div class="detail-block"><h3>Participantes</h3><p>Quem você quer convidar para participar do seu projeto?</p><input class="input" id="participant-search" placeholder="Buscar estudantes..."><div id="participant-list" class="invite-list"></div><button type="button" class="secondary-button invite-button" data-invite-type="participant">Convidar participantes</button></div><button class="primary-button" type="submit">Cadastrar projeto</button></form></section></div>`;setupProjectForm()}
function closeModal(){modalRoot.innerHTML=""}function setupProjectForm(){const ts=[{id:"t1",nome:"Prof.ª Carla Mendes",username:"carla.mendes",avatar:"◆"},{id:"t2",nome:"Prof. João Lima",username:"joao.lima",avatar:"★"}],ps=[{id:"p1",nome:"Mariana Silva",username:"mariana.silva",avatar:"✦"},{id:"p2",nome:"Sidney Alves",username:"sidney",avatar:"★"}];document.getElementById("teacher-list").innerHTML=ts.map(x=>`<label class="invite-row"><input type="checkbox" data-teacher-id="${x.id}">${avatar(x)}<span><strong>${x.nome}</strong><small>@${x.username}</small></span></label>`).join("");document.getElementById("participant-list").innerHTML=ps.map(x=>`<label class="invite-row"><input type="checkbox" data-participant-id="${x.id}">${avatar(x)}<span><strong>${x.nome}</strong><small>@${x.username}</small></span></label>`).join("")}async function resolveEmail(identifier){const v=identifier.trim();if(v.includes("@"))return v.toLowerCase();const r=await supabaseClient.rpc("resolve_username",{username_input:v});if(!r.error&&r.data?.length)return r.data[0].email;const f=await supabaseClient.from("profiles").select("email").ilike("username",v).maybeSingle();if(!f.error)return f.data?.email||null;return null}async function login(e){e.preventDefault();const form=e.currentTarget,message=document.getElementById("login-message"),identifier=form.elements.namedItem("identifier")?.value?.trim(),password=form.elements.namedItem("password")?.value;if(!identifier||!password){message.textContent="Informe o e-mail/username e a senha.";return}const button=form.querySelector('button[type="submit"]');button.disabled=true;button.textContent="Entrando...";try{const email=await resolveEmail(identifier);if(!email){message.textContent="Usuário ou e-mail não encontrado.";return}const r=await supabaseClient.auth.signInWithPassword({email,password});if(r.error){message.textContent=errorText(r.error);return}const s=await supabaseClient.auth.getSession();if(!s.data.session){message.textContent="O Supabase não confirmou a sessão.";return}await loadProfile(s.data.session.user);await loadData();renderApp()}catch(err){message.textContent=errorText(err)}finally{button.disabled=false;button.textContent="Entrar"}}async function loadProfile(u){const r=await supabaseClient.from("profiles").select("*").eq("id",u.id).maybeSingle();state.currentUser=r.data||{id:u.id,nome:u.user_metadata?.nome||"Usuário",username:u.user_metadata?.username||"",email:u.email,curso:u.user_metadata?.curso||"",avatar:"✦"}}async function loadData(){const p=await supabaseClient.from("projects").select("*").or(`status_publicacao.eq.publicado,autora_id.eq.${state.currentUser.id}`).order("created_at",{ascending:false});const n=await supabaseClient.from("news").select("*").eq("status","publicado").order("publicado_em",{ascending:false});state.projects=p.data||[];state.news=n.data||[]}async function submitAccount(e){e.preventDefault();const m=document.getElementById("account-message"),role=document.getElementById("account-role").value,course=document.querySelector('input[name="account-course"]:checked')?.value;if(role==="aluna"&&!course){m.textContent="Selecione um curso.";return}const r=await supabaseClient.auth.signUp({email:document.getElementById("account-email").value.trim(),password:document.getElementById("account-password").value,options:{data:{nome:document.getElementById("account-name").value.trim(),username:document.getElementById("account-username").value.trim().toLowerCase(),curso:role==="aluna"?course:null,tipo_solicitado:role},emailRedirectTo:SITE_URL}});if(r.error){m.textContent=errorText(r.error);return}closeModal();toastMessage("Cadastro realizado. Confirme o e-mail antes de entrar.")}async function submitProject(e){e.preventDefault();const r=await supabaseClient.from("projects").insert({titulo:document.getElementById("project-title").value.trim(),descricao:document.getElementById("project-description").value.trim(),area:document.getElementById("project-area").value,autora_id:state.currentUser.id,status_publicacao:"pendente"});if(r.error){toastMessage(r.error.message);return}closeModal();await loadData();renderApp();toastMessage("Projeto enviado para análise.")}async function submitSuggestion(e){e.preventDefault();state.suggestions.unshift({titulo:document.getElementById("suggestion-title").value,descricao:document.getElementById("suggestion-description").value});renderApp();toastMessage("Sugestão registrada.")}function go(p){state.currentPage=p;renderApp()}function action(a){if(a==="create-account")openModal("account");if(a==="create-project")openModal("project");if(a==="forgot-password")openModal("forgot");if(a==="logout")supabaseClient.auth.signOut();if(a==="toggle-menu")document.getElementById("sidebar")?.classList.toggle("open");if(a==="notifications")toastMessage("Você não tem novas notificações.");if(a==="coming-soon")toastMessage("Esta função será conectada ao banco.")}
async function init(){const s=await supabaseClient.auth.getSession();if(s.data.session){await loadProfile(s.data.session.user);await loadData();renderApp()}else renderLogin();supabaseClient.auth.onAuthStateChange(async(e,s)=>{if(e==="SIGNED_IN"&&s){await loadProfile(s.user);await loadData();renderApp()}if(e==="SIGNED_OUT")renderLogin()})}function initCanvas(){const c=document.getElementById("network-canvas");if(!c)return;const x=c.getContext("2d"),pts=[];let w=0,h=0;function resize(){w=c.clientWidth;h=c.clientHeight;const r=window.devicePixelRatio||1;c.width=w*r;c.height=h*r;x.setTransform(r,0,0,r,0,0)}for(let i=0;i<58;i++)pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25});function draw(){x.clearRect(0,0,w,h);pts.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;x.fillStyle="#A8D719";x.beginPath();x.arc(p.x,p.y,2,0,7);x.fill();pts.slice(i+1).forEach(q=>{const d=Math.hypot(p.x-q.x,p.y-q.y);if(d<145){x.strokeStyle=`rgba(222,203,226,${(1-d/145)*.23})`;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}})}requestAnimationFrame(draw)}resize();addEventListener("resize",resize);draw()}
document.addEventListener("submit",e=>{if(e.target.id==="login-form")login(e);if(e.target.id==="account-form")submitAccount(e);if(e.target.id==="project-form")submitProject(e);if(e.target.id==="suggestion-form")submitSuggestion(e)});document.addEventListener("click",e=>{const a=e.target.closest("[data-action]"),p=e.target.closest("[data-page]"),r=e.target.closest("[data-role-choice]"),t=e.target.closest("[data-toggle-password]"),i=e.target.closest("[data-invite-type]");if(e.target.matches("[data-close-modal]")||e.target.closest(".close-button"))closeModal();if(r){document.querySelectorAll("[data-role-choice]").forEach(x=>x.classList.remove("selected"));r.classList.add("selected");const v=r.dataset.roleChoice,g=document.getElementById("account-course-group");document.getElementById("account-role").value=v;g.hidden=v==="professores";g.style.display=v==="professores"?"none":"block";document.querySelectorAll('[name="account-course"]').forEach(x=>{x.required=v==="aluna";if(v==="professores")x.checked=false})}if(i)toastMessage(`${document.querySelectorAll(i.dataset.inviteType==="teacher"?"[data-teacher-id]:checked":"[data-participant-id]:checked").length} convite(s) selecionado(s).`);if(a)action(a.dataset.action);if(p)go(p.dataset.page);if(t){const input=document.getElementById(t.dataset.togglePassword);input.type=input.type==="password"?"text":"password"}});document.addEventListener("input",e=>{if(e.target.id==="teacher-search"){const q=e.target.value.toLowerCase();document.querySelectorAll("#teacher-list .invite-row").forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?"flex":"none")}if(e.target.id==="participant-search"){const q=e.target.value.toLowerCase();document.querySelectorAll("#participant-list .invite-row").forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?"flex":"none")}});init();
</script>
