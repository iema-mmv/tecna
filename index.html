<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Tecna | Diagnóstico de acesso</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FCFAFD;color:#241A2B;font-family:system-ui,sans-serif}.card{width:min(440px,calc(100% - 40px));padding:28px;border-radius:18px;background:#fff;box-shadow:0 18px 45px #4b12621f}.logo{width:170px;display:block;margin:0 auto 25px}.eyebrow{color:#70227F;font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.input{display:block;width:100%;box-sizing:border-box;margin:8px 0 16px;padding:14px;border:1px solid #E9E2EB;border-radius:10px;font:inherit}.button{width:100%;padding:14px;border:0;border-radius:10px;background:#A8D719;color:#321047;font-weight:800;font:inherit}.message{min-height:40px;margin:15px 0;color:#C62828;font-size:.9rem;line-height:1.5}.details{margin-top:18px;padding:13px;border-radius:10px;background:#F1E8F3;color:#51465A;font-size:.82rem;line-height:1.45;white-space:pre-wrap}</style>
</head>
<body><main class="card"><img class="logo" src="logo-tecna.jpg" alt="Tecna"><p class="eyebrow">Diagnóstico de acesso</p><h1>Entrar no Tecna</h1><p>Use o e-mail exato da conta ou o username cadastrado.</p><form id="login-form"><label for="identifier">E-mail ou username</label><input class="input" id="identifier" autocomplete="username" required><label for="password">Senha</label><input class="input" id="password" type="password" autocomplete="current-password" required><button class="button" id="submit" type="submit">Entrar</button></form><p id="message" class="message"></p><div id="details" class="details" hidden></div></main>
<script>
const URL="https://jcifrmieaoqfnytdfnoz.supabase.co",KEY="sb_publishable_o-vRHdS3VC-40bEGIDIBUw_OtcMy5z-",client=window.supabase.createClient(URL,KEY);const form=document.getElementById("login-form"),message=document.getElementById("message"),details=document.getElementById("details"),button=document.getElementById("submit");
function show(text,info=""){message.textContent=text;if(info){details.hidden=false;details.textContent=info}}
async function resolveEmail(value){const input=value.trim();if(input.includes("@"))return{email:input.toLowerCase(),source:"e-mail direto"};const result=await client.rpc("resolve_username",{username_input:input});if(!result.error&&result.data?.length)return{email:result.data[0].email,source:"username via função SQL"};const fallback=await client.from("profiles").select("email,username").ilike("username",input).maybeSingle();if(!fallback.error&&fallback.data?.email)return{email:fallback.data.email,source:"username via perfil"};return{email:null,error:result.error||fallback.error}}
form.addEventListener("submit",async event=>{event.preventDefault();message.textContent="";details.hidden=true;button.disabled=true;button.textContent="Entrando...";const identifier=document.getElementById("identifier").value,password=document.getElementById("password").value;try{const resolved=await resolveEmail(identifier);if(!resolved.email){show("Não foi possível encontrar o e-mail desta conta.",`A busca do username não retornou um e-mail.\n\nErro técnico: ${resolved.error?.message||"nenhum registro encontrado"}`);return}const result=await client.auth.signInWithPassword({email:resolved.email,password});if(result.error){show(`O Supabase recusou o acesso: ${result.error.message}`,`E-mail resolvido: ${resolved.email}\nOrigem: ${resolved.source}\n\nSe o e-mail estiver correto, o problema é a senha, confirmação do e-mail ou a conta existente no Auth.`);return}show("Login realizado com sucesso.",`E-mail resolvido: ${resolved.email}\nOrigem: ${resolved.source}`);setTimeout(()=>location.href="https://iema-mmv.github.io/tecna/",700)}catch(error){show("Ocorreu um erro ao tentar entrar.",error?.message||String(error))}finally{button.disabled=false;button.textContent="Entrar"}});
</script></body></html>
