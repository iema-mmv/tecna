    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;color:var(--slate-950);background:var(--page);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(168,215,25,.55);outline-offset:3px}.app-shell{min-height:100vh}.login-screen{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(420px,.92fr);background:#fff}.login-visual{position:relative;min-height:100vh;overflow:hidden;color:#fff;background:radial-gradient(circle at 14% 18%,rgba(209,106,166,.33),transparent 26%),radial-gradient(circle at 83% 76%,rgba(162,117,174,.48),transparent 30%),linear-gradient(145deg,#321047,#5B176F 54%,#85428F)}#network-canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.72}.visual-content{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:space-between;min-height:100vh;padding:clamp(28px,6vw,86px)}.brand-logo{display:block;width:170px;height:auto;object-fit:contain}.visual-logo{width:min(290px,66vw);padding:12px;border-radius:18px;background:rgba(255,255,255,.94);box-shadow:0 14px 30px rgba(25,6,35,.16)}.hero-copy{max-width:620px;margin:auto 0;padding:48px 0}.eyebrow{margin:0;color:var(--purple-700);font-size:.77rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.hero-copy .eyebrow{color:#F4E8F5}.hero-copy h1{max-width:610px;margin:16px 0;font-size:clamp(2.5rem,5vw,5.3rem);line-height:.98;letter-spacing:-.065em}.hero-copy p{max-width:520px;margin:0;color:#F1E8F3;font-size:clamp(1rem,1.6vw,1.22rem);line-height:1.7}.hero-keywords{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}.hero-keywords span{padding:9px 13px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(255,255,255,.1)}.login-panel{display:grid;place-items:center;padding:42px clamp(22px,6vw,86px);background:line round:linear-gradient(90deg,var(--purple-700),var(--green-500))}.project-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:13px;color:var(--slate-500);font-size:.76rem}.status-pill{padding:4px 8px;color:#587900;border-radius:999px;background:var(--green-100);font-weight:800}.status-pill.purple{color:var(--purple-800);background:var(--purple-100)}.poll-box{padding:18px;border-radius:14px;background:linear-gradient(135deg,var(--purple-100),#FCF0F7)}.poll-box h3{margin:0 0 8px;color:var(--purple-950);font-size:1rem}.poll-box p{margin:0 0 15px;color:var(--slate-500);font-size:.84rem;line-height:1.5}.poll-option{display:flex;align-items:center;gap:9px;width:100%;margin-top:8px;padding:10px;color:var(--slate-700);border:1px solid var(--purple-200);border-radius:10px;background:#fff;text-align:left}.poll-option.selected,.poll-option:hover{border-color:var(--purple-600);color:var(--purple-800);background:#FAF4FB}.news-list{display:grid;gap:14px}.news-item{display:flex;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--slate-100)}.news-item:last-child{padding-bottom:0;border-bottom:0}.news-thumb{display:grid;flex:0 0 auto;width:52px;height:52px;place-items:center;color:#fff;border-radius:12px;background:linear-gradient(135deg,var(--purple-700),var(--pink-500))}.news-item h3{margin:0 0 5px;color:var(--purple-950);font-size:.88rem}.news-item p{margin:0;color:var(--slate-500);font-size:.77rem;line-height:1.4}.news-item time{display:block;margin-top:5px;color:var(--slate-500);font-size:.7rem}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.gallery-item{display:grid;aspect-ratio:1;place-items:center;border-radius:10px;color:#fff;background:linear-gradient(135deg,#C8B4D1,#F5D4E7)}.gallery-item:nth-child(2){background:linear-gradient(135deg,#D9ED92,#B7DC42)}.gallery-item:nth-child(3){background:linear-gradient(135deg,#C7D8F4,#C8B4D1)}.gallery-item:nth-child(4){background:linear-gradient(135deg,#F5D4E7,#E8D58D)}.page-section{display:none}.page-section.active{display:block}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}.toolbar .input{max-width:310px}.toolbar .select{max-width:190px}.empty-state{padding:50px 20px;color:var(--slate-500);text-align:center}.modal-backdrop{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:20px;background:rgba(50,16,71,.58)}.modal{width:min(100%,620px);max-height:90vh;overflow:auto;padding:26px;border-radius:24px;background:#fff;box-shadow:var(--shadow)}.modal-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}.modal-header h2{margin:0;color:var(--purple-950)}.close-button{display:grid;width:36px;height:36px;place-items:center;color:var(--slate-500);border:1px solid var(--slate-200);border-radius:10px;background:#fff}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.form-grid .full{grid-column:1/-1}.textarea{min-height:100px;resize:vertical}.toast{position:fixed;z-index:30;right:22px;bottom:22px;max-width:360px;padding:14px 17px;color:#fff;border-radius:12px;background:var(--purple-950);box-shadow:var(--shadow);opacity:0;transform:translateY(15px);pointer-events:none;transition:opacity .25s,transform .25s}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:1120px){.login-screen{grid-template-columns:minmax(0,.85fr) minmax(400px,1fr)}.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-grid{grid-template-columns:1fr}}@media(max-width:820px){.login-screen{display:block}.login-visual{min-height:380px}.visual-content{min-height:380px;padding:28px}.visual-logo{width:190px}.hero-copy{margin:25px 0 0;padding:0}.hero-copy h1{font-size:clamp(2.3rem,10vw,4rem)}.login-panel{min-height:620px;padding:46px 24px}.mobile-brand{display:block}.app-layout{display:block}.sidebar{position:fixed;z-index:12;left:0;top:0;width:270px;transform:translateX(-105%);transition:transform .25s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.menu-button{display:grid}.main-content{padding-top:20px}}@media(max-width:560px){.topbar{align-items:flex-start}.top-actions .secondary-button{display:none}.stats-grid,.project-grid,.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.content-card{padding:17px}.modal{padding:20px}}

<body>
  <main id="app" class="app-shell"></main>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    "use strict";

    const LOGO_PATH = "logo-tecna.jpg";
    const SUPABASE_URL = "https://jcifrmieaoqfnytdfnoz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_o-vRHdS3VC-40bEGIDIBUw_OtcMy5z-";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const SITE_URL = "https://iema-mmv.github.io/tecna/";
    const state = { loggedIn: false, currentPage: "dashboard", currentUser: null, projects: [], news: [], poll: { selected: "", voted: false } };
    const app = document.getElementById("app");
    const modalRoot = document.getElementById("modal-root");
    const toast = document.getElementById("toast");

    function escapeHtml(value) { return String(value ?? "").replace(/[&<>'"]/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#039;", '"': "&quot;" }[character])); }
    function showToast(message) { toast.textContent = message; toast.classList.add("show"); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove("show"), 4500); }
    function brandMarkup(classes = "brand-logo") { return `<img class="${classes}" src="${LOGO_PATH}" alt="Tecna — projetos que conectam" onerror="this.style.display='none'">`; }
    function authError(error) { const code = error?.code || ""; const message = error?.message || "Erro desconhecido."; if (code === "email_not_confirmed" || message.includes("Email not confirmed")) return "O e-mail ainda não foi confirmado. Verifique a caixa de entrada ou desative a confirmação temporariamente no Supabase."; if (code === "invalid_credentials" || message.includes("Invalid login credentials")) return "E-mail ou senha incorretos."; if (code === "signup_disabled") return "O cadastro de novos usuários está desativado no Supabase."; if (code === "email_provider_disabled") return "O provedor de e-mail está desativado no Supabase."; if (code === "user_already_exists" || message.includes("already registered")) return "Este e-mail já possui cadastro."; return `${code ? `${code}: ` : ""}${message}`; }

    function renderLogin() {
      app.innerHTML = `<section class="login-screen" aria-label="Acesso ao Tecna"><section class="login-visual" aria-hidden="true"><canvas id="network-canvas"></canvas><div class="visual-content">${brandMarkup("brand-logo visual-logo")}<div class="hero-copy"><p class="eyebrow">Comunidade estudantil</p><h1>Ideias que se conectam.</h1><p>Crie, acompanhe e compartilhe projetos que transformam o futuro da tecnologia.</p><div class="hero-keywords"><span>✦ Criar</span><span>↗ Colaborar</span><span>♡ Aprender</span></div></div><small>Um espaço para dar visibilidade ao talento e à criatividade.</small></div></section><section class="login-panel"><div class="auth-card"><div class="mobile-brand">${brandMarkup("brand-logo mobile-logo")}</div><p class="eyebrow">Acesso à plataforma</p><h2>Bem-vinda ao Tecna</h2><p class="auth-intro">Entre para acompanhar e compartilhar projetos.</p><form id="login-form" novalidate><div class="form-group"><label for="login-email">E-mail</label><input class="input" id="login-email" name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required></div><div class="form-group"><label for="login-password">Senha</label><div class="input-wrap"><input class="input password-input" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required minlength="6"><button class="toggle-password" type="button" data-toggle-password="login-password" aria-label="Mostrar senha">◉</button></div></div><div class="password-row"><label class="checkbox-label"><input type="checkbox" name="remember"> Lembrar de mim</label><button class="text-button" type="button" data-action="forgot-password">Esqueci minha senha</button></div><p id="login-message" class="auth-message" role="alert"></p><button class="primary-button" type="submit">Entrar</button></form><div class="auth-divider">ou</div><button class="secondary-button" type="button" data-action="create-account" style="width:100%">Criar uma conta</button><p class="auth-footer">Plataforma educacional Tecna.</p></div></section></section>`;
      initCanvas();
    }

    function pageTitle() { return ({ dashboard: `Olá, ${(state.currentUser?.nome || "estudante").split(" ")[0]}!`, projects: "Projetos", news: "Notícias do Tecna", voting: "Votações", profile: "Meu perfil" })[state.currentPage] || "Olá!"; }
    function pageSubtitle() { return ({ dashboard: "Acompanhe suas ideias e descubra novos projetos.", projects: "Explore projetos, equipes e ideias da comunidade.", news: "Acompanhe as novidades e conquistas da comunidade.", voting: "Participe das decisões e valorize projetos inspiradores.", profile: "Apresente sua trajetória e seus interesses." })[state.currentPage] || ""; }
    function renderApp() { app.innerHTML = `<div class="app-layout"><aside id="sidebar" class="sidebar">${brandMarkup("brand-logo sidebar-logo")}<nav class="sidebar-nav" aria-label="Navegação principal"><button class="nav-item ${state.currentPage === "dashboard" ? "active" : ""}" data-page="dashboard"><span class="nav-icon">⌂</span>Visão geral</button><button class="nav-item ${state.currentPage === "projects" ? "active" : ""}" data-page="projects"><span class="nav-icon">▣</span>Projetos</button><button class="nav-item ${state.currentPage === "news" ? "active" : ""}" data-page="news"><span class="nav-icon">✦</span>Notícias</button><button class="nav-item ${state.currentPage === "voting" ? "active" : ""}" data-page="voting"><span class="nav-icon">◉</span>Votações</button><button class="nav-item ${state.currentPage === "profile" ? "active" : ""}" data-page="profile"><span class="nav-icon">♙</span>Meu perfil</button></nav><div class="sidebar-bottom"><div class="profile-mini"><span class="avatar">${escapeHtml((state.currentUser?.nome || "NS").slice(0, 2).toUpperCase())}</span><div><strong>${escapeHtml(state.currentUser?.nome || "Nova estudante")}</strong><small>${escapeHtml(state.currentUser?.curso || "Estudante")}</small></div></div><button class="logout-button" data-action="logout">↪ Sair da conta</button></div></aside><section class="main-content"><header class="topbar"><div><button class="icon-button menu-button" data-action="toggle-menu" aria-label="Abrir menu">☰</button><h1>${pageTitle()}</h1><p>${pageSubtitle()}</p></div><div class="top-actions"><button class="secondary-button" data-action="create-project">+ Novo projeto</button><button class="icon-button" data-action="notifications" aria-label="Notificações">♧</button></div></header>${renderCurrentPage()}</section></div>`; }
    function renderCurrentPage() { if (state.currentPage === "projects") return renderProjectsPage(); if (state.currentPage === "news") return renderNewsPage(); if (state.currentPage === "voting") return renderVotingPage(); if (state.currentPage === "profile") return renderProfilePage(); return renderDashboard(); }
    function projectCard(project) { return `<article class="project-card"><div class="project-cover"><h3>${escapeHtml(project.titulo)}</h3></div><div class="project-body"><p>${escapeHtml(project.descricao)}</p><div class="progress-row"><span>Progresso</span><span>${project.progresso || 0}%</span></div><div class="progress-track"><div class="progress-bar" style="width:${project.progresso || 0}%"></div></div><div class="project-meta"><span>${escapeHtml(project.area)}</span><span class="status-pill ${project.progresso < 60 ? "purple" : ""}">${escapeHtml(project.status || "Planejamento")}</span></div></div></article>`; }
    function newsItem(news) { return `<article class="news-item"><div class="news-thumb">✦</div><div><h3>${escapeHtml(news.titulo)}</h3><p>${escapeHtml(news.resumo || "")}</p><time>${news.publicado_em ? new Date(news.publicado_em).toLocaleDateString("pt-BR") : "Recentemente"}</time></div></article>`; }
    function renderDashboard() { const average = state.projects.length ? Math.round(state.projects.reduce((sum, project) => sum + (project.progresso || 0), 0) / state.projects.length) : 0; return `<section class="page-section active"><div class="stats-grid"><article class="stat-card"><span class="stat-label">Meus projetos</span><div class="stat-value">${state.projects.length}</div><div class="stat-trend">Projetos cadastrados</div></article><article class="stat-card"><span class="stat-label">Projetos acompanhados</span><div class="stat-value">0</div><div class="stat-trend">Em breve</div></article><article class="stat-card"><span class="stat-label">Sugestões recebidas</span><div class="stat-value">0</div><div class="stat-trend">Nenhuma pendência</div></article><article class="stat-card"><span class="stat-label">Progresso médio</span><div class="stat-value">${average}%</div><div class="stat-trend">Baseado nos seus projetos</div></article></div><div class="dashboard-grid"><article class="content-card"><div class="card-heading"><div><h2>Projetos em destaque</h2><p>Ideias que estão movimentando a comunidade.</p></div><button class="link-button" data-page="projects">Ver todos</button></div><div class="project-grid">${state.projects.length ? state.projects.slice(0, 4).map(projectCard).join("") : `<div class="empty-state" style="grid-column:1/-1">Você ainda não cadastrou nenhum projeto.</div>`}</div></article><div style="display:grid;gap:22px;align-content:start"><article class="content-card"><div class="card-heading"><div><h2>Votação aberta</h2><p>Sua opinião ajuda a dar visibilidade.</p></div><span class="status-pill purple">Ativa</span></div><div class="poll-box"><h3>Projeto destaque da semana</h3><p>A votação será conectada na próxima etapa.</p><button class="primary-button button-small" data-page="voting">Ver votação</button></div></article><article class="content-card"><div class="card-heading"><div><h2>Notícias recentes</h2><p>O que está acontecendo no Tecna.</p></div><button class="link-button" data-page="news">Ver todas</button></div><div class="news-list">${state.news.length ? state.news.slice(0, 2).map(newsItem).join("") : `<div class="empty-state">As notícias aparecerão aqui.</div>`}</div></article></div></div><article class="content-card" style="margin-top:22px"><div class="card-heading"><div><h2>Galeria de projetos</h2><p>Registros recentes das equipes em ação.</p></div></div><div class="gallery"><div class="gallery-item">✦</div><div class="gallery-item">⌁</div><div class="gallery-item">◈</div><div class="gallery-item">♡</div></div></article></section>`; }
    function renderProjectsPage() { return `<section class="page-section active"><div class="toolbar"><input class="input" id="project-search" type="search" placeholder="Buscar projeto..."><select class="select" id="project-filter"><option value="all">Todas as áreas</option><option>Sustentabilidade</option><option>Robótica</option><option>Aplicativos</option><option>Cultura</option><option>Inteligência artificial</option></select><button class="primary-button button-small" data-action="create-project">+ Cadastrar projeto</button></div><div id="projects-list" class="project-grid">${state.projects.length ? state.projects.map(projectCard).join("") : `<div class="empty-state" style="grid-column:1/-1">Nenhum projeto cadastrado ainda.</div>`}</div></section>`; }
    function renderNewsPage() { return `<section class="page-section active"><article class="content-card"><div class="card-heading"><div><h2>Atualizações da comunidade</h2><p>Notícias, comunicados e conquistas das equipes.</p></div></div><div class="news-list">${state.news.length ? state.news.map(newsItem).join("") : `<div class="empty-state">Nenhuma notícia publicada.</div>`}</div></article></section>`; }
    function renderVotingPage() { return `<section class="page-section active"><article class="content-card"><div class="card-heading"><div><h2>Projeto destaque da semana</h2><p>O painel de votação será ativado na próxima etapa.</p></div><span class="status-pill purple">Em preparação</span></div><div class="poll-box"><h3>Votações do Tecna</h3><p>O banco já possui a estrutura para receber votações reais.</p></div></article></section>`; }
    function renderProfilePage() { const user = state.currentUser || {}; return `<section class="page-section active"><article class="content-card"><div style="display:flex;align-items:center;gap:18px;margin-bottom:25px"><span class="avatar" style="width:76px;height:76px;font-size:1.4rem">${escapeHtml((user.nome || "NS").slice(0, 2).toUpperCase())}</span><div><h2 style="margin:0;color:var(--purple-950)">${escapeHtml(user.nome || "Nova estudante")}</h2><p style="margin:6px 0;color:var(--slate-500)">${escapeHtml(user.curso || "Curso não informado")} · ${escapeHtml(user.turma || "Turma não informada")}</p></div></div><div class="form-grid"><div class="form-group"><label>Nome completo</label><input class="input" id="profile-name" value="${escapeHtml(user.nome || "")}"></div><div class="form-group"><label>Curso</label><input class="input" id="profile-course" value="${escapeHtml(user.curso || "")}"></div><div class="form-group"><label>Turma</label><input class="input" id="profile-class" value="${escapeHtml(user.turma || "")}"></div><div class="form-group"><label>Áreas de interesse</label><input class="input" id="profile-interests" value="Desenvolvimento web, IA"></div><div class="form-group full"><label>Sobre você</label><textarea class="textarea" id="profile-bio">${escapeHtml(user.biografia || "")}</textarea></div></div><button class="primary-button button-small" data-action="save-profile" style="margin-top:8px">Salvar alterações</button></article></section>`; }
    function openModal(type) { if (type === "forgot") modalRoot.innerHTML = `<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true"><div class="modal-header"><div><p class="eyebrow">Recuperação de acesso</p><h2>Esqueci minha senha</h2></div><button class="close-button" data-close-modal>×</button></div><p style="color:var(--slate-500);line-height:1.6">Informe seu e-mail para receber o link de redefinição.</p><form id="forgot-form"><div class="form-group"><label for="forgot-email">E-mail</label><input class="input" id="forgot-email" type="email" required></div><button class="primary-button" type="submit">Enviar instruções</button></form></section></div>`; if (type === "account") modalRoot.innerHTML = `<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true"><div class="modal-header"><div><p class="eyebrow">Faça parte da comunidade</p><h2>Criar uma conta</h2></div><button class="close-button" data-close-modal>×</button></div><form id="account-form"><div class="form-grid"><div class="form-group full"><label for="account-name">Nome completo</label><input class="input" id="account-name" required></div><div class="form-group"><label for="account-email">E-mail</label><input class="input" id="account-email" type="email" required></div><div class="form-group"><label for="account-course">Curso</label><input class="input" id="account-course" required></div><div class="form-group"><label for="account-class">Turma</label><input class="input" id="account-class" required></div><div class="form-group"><label for="account-password">Senha</label><input class="input" id="account-password" type="password" minlength="6" required></div><div class="form-group full"><label for="account-about">Breve apresentação</label><textarea class="textarea" id="account-about"></textarea></div></div><p id="account-message" class="auth-message" role="alert"></p><button class="primary-button" type="submit">Criar conta</button></form></section></div>`; if (type === "project") modalRoot.innerHTML = `<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true"><div class="modal-header"><div><p class="eyebrow">Nova iniciativa</p><h2>Cadastrar projeto</h2></div><button class="close-button" data-close-modal>×</button></div><form id="project-form"><div class="form-grid"><div class="form-group full"><label for="project-title">Nome do projeto</label><input class="input" id="project-title" required></div><div class="form-group"><label for="project-area">Área</label><select class="select" id="project-area"><option>Sustentabilidade</option><option>Robótica</option><option>Aplicativos</option><option>Cultura</option><option>Inteligência artificial</option></select></div><div class="form-group"><label for="project-progress">Progresso inicial</label><input class="input" id="project-progress" type="number" min="0" max="100" value="0" required></div><div class="form-group full"><label for="project-description">Objetivo e descrição</label><textarea class="textarea" id="project-description" required></textarea></div></div><p id="project-message" class="auth-message" role="alert"></p><button class="primary-button" type="submit">Salvar projeto</button></form></section></div>`; }
    function closeModal() { modalRoot.innerHTML = ""; }

    async function loadUser() { const { data: { session } } = await supabaseClient.auth.getSession(); if (session) { state.loggedIn = true; await loadProfile(session.user); await loadData(); renderApp(); } else { state.loggedIn = false; renderLogin(); } supabaseClient.auth.onAuthStateChange(async (event, currentSession) => { if (event === "SIGNED_OUT") { state.loggedIn = false; state.currentUser = null; state.projects = []; state.news = []; renderLogin(); } if (event === "SIGNED_IN" && currentSession) { state.loggedIn = true; await loadProfile(currentSession.user); await loadData(); renderApp(); } }); }
    async function loadProfile(user) { const { data, error } = await supabaseClient.from("profiles").select("*").eq("id", user.id).maybeSingle(); if (error || !data) { state.currentUser = { id: user.id, nome: user.user_metadata?.nome || "Nova estudante", email: user.email, curso: user.user_metadata?.curso || "", turma: user.user_metadata?.turma || "", biografia: user.user_metadata?.biografia || "" }; } else state.currentUser = data; }
    async function loadData() { const { data: projects } = await supabaseClient.from("projects").select("*").or(`status_publicacao.eq.publicado,autora_id.eq.${state.currentUser.id}`).order("created_at", { ascending: false }); const { data: news } = await supabaseClient.from("news").select("*").eq("status", "publicado").order("publicado_em", { ascending: false }); state.projects = projects || []; state.news = news || []; }
    async function login(event) { event.preventDefault(); const form = event.currentTarget; const message = document.getElementById("login-message"); const email = form.email.value.trim(); const password = form.password.value; message.textContent = ""; if (!email || !email.includes("@")) { message.textContent = "Digite um e-mail válido."; return; } if (password.length < 6) { message.textContent = "A senha deve ter pelo menos 6 caracteres."; return; } const button = form.querySelector("button[type='submit']"); button.disabled = true; button.textContent = "Entrando..."; const { error } = await supabaseClient.auth.signInWithPassword({ email, password }); button.disabled = false; button.textContent = "Entrar"; if (error) message.textContent = authError(error); }
    async function submitAccount(event) { event.preventDefault(); const message = document.getElementById("account-message"); const name = document.getElementById("account-name").value.trim(); const email = document.getElementById("account-email").value.trim(); const course = document.getElementById("account-course").value.trim(); const className = document.getElementById("account-class").value.trim(); const password = document.getElementById("account-password").value; const about = document.getElementById("account-about").value.trim(); const button = event.currentTarget.querySelector("button[type='submit']"); button.disabled = true; button.textContent = "Criando..."; const { data, error } = await supabaseClient.auth.signUp({ email, password, options: { data: { nome: name, curso: course, turma: className, biografia: about }, emailRedirectTo: SITE_URL } }); button.disabled = false; button.textContent = "Criar conta"; if (error) { console.error("Erro completo do cadastro:", error); message.textContent = authError(error); return; } closeModal(); if (data.session) showToast("Conta criada e login realizado."); else showToast("Conta criada. Verifique seu e-mail para confirmar o cadastro."); }
    async function submitProject(event) { event.preventDefault(); const message = document.getElementById("project-message"); if (!state.currentUser?.id) { message.textContent = "Faça login para cadastrar um projeto."; return; } const titulo = document.getElementById("project-title").value.trim(); const descricao = document.getElementById("project-description").value.trim(); const area = document.getElementById("project-area").value; const progresso = Math.max(0, Math.min(100, Number(document.getElementById("project-progress").value))); const { error } = await supabaseClient.from("projects").insert({ titulo, descricao, area, progresso, autora_id: state.currentUser.id, status: progresso >= 100 ? "concluido" : progresso > 0 ? "em_andamento" : "planejamento", status_publicacao: "pendente" }); if (error) { message.textContent = `Erro ao salvar projeto: ${error.message}`; return; } closeModal(); await loadData(); renderApp(); showToast("Projeto enviado para análise."); }
    async function saveProfile() { const payload = { nome: document.getElementById("profile-name").value.trim(), curso: document.getElementById("profile-course").value.trim(), turma: document.getElementById("profile-class").value.trim(), biografia: document.getElementById("profile-bio").value.trim(), updated_at: new Date().toISOString() }; const { data, error } = await supabaseClient.from("profiles").update(payload).eq("id", state.currentUser.id).select().single(); if (error) { showToast(`Erro ao salvar perfil: ${error.message}`); return; } state.currentUser = data; renderApp(); showToast("Perfil atualizado com sucesso."); }
    async function sendPasswordReset(event) { event.preventDefault(); const email = document.getElementById("forgot-email").value.trim(); const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: SITE_URL }); closeModal(); showToast(error ? authError(error) : "Confira seu e-mail para redefinir a senha."); }
    function initCanvas() { const canvas = document.getElementById("network-canvas"); if (!canvas) return; const ctx = canvas.getContext("2d"); const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches; const points = []; const pointer = { x: null, y: null }; const colors = ["#FFF", "#DECBE2", "#F5D4E7", "#A8D719"]; let width = 0; let height = 0; function resize() { const ratio = Math.min(devicePixelRatio || 1, 2); width = canvas.clientWidth; height = canvas.clientHeight; canvas.width = width * ratio; canvas.height = height * ratio; ctx.setTransform(ratio, 0, 0, ratio, 0, 0); } function create() { points.length = 0; const amount = Math.min(74, Math.max(28, Math.floor(width * height / 17000))); for (let i = 0; i < amount; i++) points.push({ x: Math.random() * width, y: Math.random() * height, vx: (Math.random() - .5) * .22, vy: (Math.random() - .5) * .22, radius: Math.random() * 2.2 + 1, color: colors[i % colors.length] }); } function draw() { ctx.clearRect(0, 0, width, height); for (const point of points) { if (!reduced) { point.x += point.vx; point.y += point.vy; if (point.x < 0 || point.x > width) point.vx *= -1; if (point.y < 0 || point.y > height) point.vy *= -1; } if (pointer.x !== null) { const dx = pointer.x - point.x; const dy = pointer.y - point.y; const distance = Math.hypot(dx, dy); if (distance < 130 && distance > 0) { point.x -= dx / distance * .12; point.y -= dy / distance * .12; } } } for (let i = 0; i < points.length; i++) for (let j = i + 1; j < points.length; j++) { const distance = Math.hypot(points[i].x - points[j].x, points[i].y - points[j].y); if (distance < 150) { ctx.strokeStyle = `rgba(255,255,255,${Math.max(0, .22 - distance / 900)})`; ctx.beginPath(); ctx.moveTo(points[i].x, points[i].y); ctx.lineTo(points[j].x, points[j].y); ctx.stroke(); } } for (const point of points) { ctx.fillStyle = point.color; ctx.beginPath(); ctx.arc(point.x, point.y, point.radius, 0, Math.PI * 2); ctx.fill(); } if (!reduced) requestAnimationFrame(draw); } resize(); create(); draw(); addEventListener("resize", () => { resize(); create(); if (reduced) draw(); }); canvas.addEventListener("pointermove", event => { const bounds = canvas.getBoundingClientRect(); pointer.x = event.clientX - bounds.left; pointer.y = event.clientY - bounds.top; }); canvas.addEventListener("pointerleave", () => { pointer.x = null; pointer.y = null; }); }
    function handleAction(action) { if (action === "forgot-password") openModal("forgot"); if (action === "create-account") openModal("account"); if (action === "create-project") openModal("project"); if (action === "logout") supabaseClient.auth.signOut(); if (action === "notifications") showToast("Você não tem novas notificações."); if (action === "toggle-menu") document.getElementById("sidebar")?.classList.toggle("open"); if (action === "save-profile") saveProfile(); }
    function setPage(page) { state.currentPage = page; renderApp(); scrollTo({ top: 0, behavior: "smooth" }); }

    document.addEventListener("submit", event => { if (event.target.id === "login-form") login(event); if (event.target.id === "forgot-form") sendPasswordReset(event); if (event.target.id === "account-form") submitAccount(event); if (event.target.id === "project-form") submitProject(event); });
    document.addEventListener("click", event => { const action = event.target.closest("[data-action]"); const page = event.target.closest("[data-page]"); const toggle = event.target.closest("[data-toggle-password]"); if (event.target.matches("[data-close-modal]") || event.target.closest("[data-close-modal]")) if (event.target.classList.contains("modal-backdrop") || event.target.closest(".close-button")) closeModal(); if (action) handleAction(action.dataset.action); if (page) setPage(page.dataset.page); if (toggle) { const input = document.getElementById(toggle.dataset.togglePassword); input.type = input.type === "password" ? "text" : "password"; toggle.setAttribute("aria-label", input.type === "password" ? "Mostrar senha" : "Ocultar senha"); } });
    document.addEventListener("input", event => { if (event.target.id === "project-search" || event.target.id === "project-filter") { const query = document.getElementById("project-search")?.value.toLowerCase() || ""; const filter = document.getElementById("project-filter")?.value || "all"; const filtered = state.projects.filter(project => (project.titulo || "").toLowerCase().includes(query) && (filter === "all" || project.area === filter)); const list = document.getElementById("projects-list"); if (list) list.innerHTML = filtered.length ? filtered.map(projectCard).join("") : `<div class="empty-state" style="grid-column:1/-1">Nenhum projeto encontrado.</div>`; } });

    loadUser();
  </script>
</body>
</html>
