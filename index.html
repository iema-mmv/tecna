<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#5B176F"><title>Tecna | Acesso</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p950:#321047;--p900:#4B1262;--p800:#5B176F;--p700:#70227F;--p200:#DECBE2;--p100:#F1E8F3;--pink:#D16AA6;--green:#A8D719;--green-dark:#8FBE0B;--s950:#241A2B;--s500:#766B7D;--s200:#E9E2EB;--page:#FCFAFD;--danger:#C62828}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--s950);background:var(--page);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.login-screen{min-height:100vh;display:grid;grid-template-columns:1.08fr .92fr;background:#fff}.login-visual{display:flex;min-height:100vh;color:#fff;background:radial-gradient(circle at 14% 18%,rgba(209,106,166,.33),transparent 26%),linear-gradient(145deg,#321047,#5B176F 54%,#85428F)}.visual-content{display:flex;flex-direction:column;justify-content:space-between;width:100%;min-height:100vh;padding:clamp(28px,6vw,86px)}.brand-logo{display:block;width:170px;height:auto}.visual-logo{width:min(290px,66vw);padding:12px;border-radius:18px;background:#fff}.hero-copy{max-width:620px;margin:auto 0;padding:48px 0}.eyebrow{margin:0;color:var(--p700);font-size:.77rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.hero-copy .eyebrow{color:#F4E8F5}.hero-copy h1{margin:16px 0;font-size:clamp(2.5rem,5vw,5.3rem);line-height:.98}.hero-copy p{max-width:520px;color:#F1E8F3;font-size:1.15rem;line-height:1.7}.hero-keywords{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}.hero-keywords span{padding:9px 13px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(255,255,255,.1)}.login-panel{display:grid;place-items:center;padding:42px clamp(22px,6vw,86px)}.auth-card{width:min(100%,440px)}.mobile-logo{display:none}.auth-card h2{margin:12px 0 10px;color:var(--p950);font-size:clamp(2rem,4vw,3rem)}.auth-intro{margin:0 0 30px;color:var(--s500);line-height:1.6}.form-group{margin-bottom:18px}.form-group label{display:block;margin-bottom:8px;color:var(--s950);font-size:.9rem;font-weight:700}.input-wrap{position:relative}.input{width:100%;padding:14px 15px;border:1px solid var(--s200);border-radius:10px;background:#fff;color:var(--s950)}.password-input{padding-right:48px}.input:focus{border-color:var(--p700);box-shadow:0 0 0 4px rgba(133,66,143,.14);outline:none}.toggle-password{position:absolute;top:50%;right:10px;transform:translateY(-50%);padding:7px;border:0;background:transparent;color:var(--s500)}.password-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.checkbox-label{display:flex;gap:8px;align-items:center;color:var(--s500);font-size:.86rem}.text-button{padding:0;border:0;background:transparent;color:var(--p700);font-weight:700}.primary-button,.secondary-button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 18px;border-radius:10px;font-weight:800;cursor:pointer}.primary-button{width:100%;border:1px solid var(--green-dark);background:linear-gradient(135deg,var(--green),#C8ED50);color:var(--p950)}.secondary-button{width:100%;border:1px solid var(--p200);background:var(--p100);color:var(--p800)}.auth-divider{display:flex;gap:14px;align-items:center;margin:24px 0;color:var(--s500);font-size:.82rem}.auth-divider:before,.auth-divider:after{content:"";height:1px;flex:1;background:var(--s200)}.auth-footer{text-align:center;color:var(--s500);font-size:.9rem}.auth-message{min-height:22px;margin:12px 0;color:var(--danger);font-size:.88rem}@media(max-width:820px){.login-screen{display:block}.login-visual{min-height:380px}.visual-content{min-height:380px;padding:28px}.hero-copy{margin:25px 0 0;padding:0}.login-panel{min-height:620px;padding:46px 24px}.mobile-logo{display:block;width:160px;margin-bottom:28px}}
</style>
</head>
<body>
<main id="app"></main>
<script>
"use strict";
const SUPABASE_URL="https://jcifrmieaoqfnytdfnoz.supabase.co";
const SUPABASE_KEY="sb_publishable_o-vRHdS3VC-40bEGIDIBUw_OtcMy5z-";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const SITE_URL="https://iema-mmv.github.io/tecna/";
const app=document.getElementById("app");
function renderLogin(){app.innerHTML=`<section class="login-screen"><section class="login-visual"><div class="visual-content"><img class="brand-logo visual-logo" src="logo-tecna.jpg" alt="Tecna"><div class="hero-copy"><p class="eyebrow">Comunidade estudantil</p><h1>Ideias que se conectam.</h1><p>Crie, acompanhe e compartilhe projetos que transformam o futuro da tecnologia.</p><div class="hero-keywords"><span>✦ Criar</span><span>↗ Colaborar</span><span>♡ Aprender</span></div></div><small>Um espaço para dar visibilidade ao talento e à criatividade.</small></div></section><section class="login-panel"><div class="auth-card"><img class="brand-logo mobile-logo" src="logo-tecna.jpg" alt="Tecna"><p class="eyebrow">Acesso à plataforma</p><h2>Bem-vindo ao Tecna</h2><p class="auth-intro">Entre para acompanhar e compartilhar projetos.</p><form id="login-form"><div class="form-group"><label for="login-identifier">E-mail ou nome de usuário</label><input id="login-identifier" class="input" type="text" autocomplete="username" placeholder="voce@exemplo.com ou seu_usuario" required></div><div class="form-group"><label for="login-password">Senha</label><div class="input-wrap"><input id="login-password" class="input password-input" type="password" autocomplete="current-password" minlength="6" required><button id="toggle-password" class="toggle-password" type="button">◉</button></div></div><div class="password-row"><label class="checkbox-label"><input type="checkbox"> Lembrar de mim</label><button id="forgot-password" class="text-button" type="button">Esqueci minha senha</button></div><p id="login-message" class="auth-message" role="alert"></p><button id="login-submit" class="primary-button" type="submit">Entrar</button></form><div class="auth-divider">ou</div><button id="create-account" class="secondary-button" type="button">Criar uma conta</button><p class="auth-footer">Plataforma educacional Tecna.</p></div></section></section>`;document.getElementById("login-form").addEventListener("submit",handleLogin);document.getElementById("toggle-password").addEventListener("click",togglePassword);document.getElementById("forgot-password").addEventListener("click",handleForgotPassword);document.getElementById("create-account").addEventListener("click",()=>{document.getElementById("login-message").textContent="O cadastro será aberto na próxima tela."})}
function authMessage(error){const message=error?.message||"Não foi possível entrar.";if(message.toLowerCase().includes("invalid login credentials"))return"E-mail/username ou senha incorretos.";if(message.toLowerCase().includes("email not confirmed"))return"Confirme o e-mail antes de entrar.";return message}
async function resolveEmail(identifier){const value=String(identifier||"").trim();if(!value)return null;if(value.includes("@"))return value.toLowerCase();const result=await supabaseClient.from("profiles").select("email").ilike("username",value).maybeSingle();if(result.error)throw result.error;return result.data?.email||null}
async function handleLogin(event){event.preventDefault();const form=event.currentTarget;const identifier=document.getElementById("login-identifier").value.trim();const password=document.getElementById("login-password").value;const message=document.getElementById("login-message");const submit=document.getElementById("login-submit");message.textContent="";if(!identifier||!password){message.textContent="Informe o e-mail/username e a senha.";return}submit.disabled=true;submit.textContent="Entrando...";try{const email=await resolveEmail(identifier);if(!email){message.textContent=identifier.includes("@")?"Não foi encontrada uma conta com este e-mail.":"Username não encontrado.";return}const result=await supabaseClient.auth.signInWithPassword({email,password});if(result.error){message.textContent=authMessage(result.error);return}window.location.href=SITE_URL}catch(error){message.textContent=authMessage(error)}finally{submit.disabled=false;submit.textContent="Entrar"}}
function togglePassword(){const input=document.getElementById("login-password");if(input)input.type=input.type==="password"?"text":"password"}
async function handleForgotPassword(){const email=window.prompt("Digite o e-mail usado no cadastro:");if(!email)return;const result=await supabaseClient.auth.resetPasswordForEmail(email.trim(),{redirectTo:SITE_URL});alert(result.error?authMessage(result.error):"Enviamos as instruções para o seu e-mail.")}
renderLogin();
</script>
</body>
</html>
